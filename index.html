<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily Circle — 日々の記録帳</title>
<meta name="description" content="Daily Circle — Circleの一年目標を、毎日の習慣でつなぐ記録帳。">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F7F4EE">
<meta name="apple-mobile-web-app-title" content="Daily Circle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:#F7F4EE;color:#191C22;
  font-family:'Zen Kaku Gothic New',-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;padding-bottom:96px;min-height:100vh}
.center-msg{padding:80px 20px;text-align:center;color:#4A4E58;letter-spacing:.12em}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px}
.brand{display:flex;gap:11px;align-items:center}
.brand-mark{width:34px;height:34px;flex-shrink:0;display:block}
.brand-mark svg{width:100%;height:100%;display:block}
.brand-name{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:18px;letter-spacing:.14em}
.brand-sub{font-size:11px;color:#4A4E58;margin-top:1px;letter-spacing:.05em}
.streak-pill{background:#191C22;color:#F7F4EE;border-radius:999px;padding:7px 15px;display:flex;align-items:baseline;gap:4px}
.streak-num{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:18px;color:#AEC0E8;line-height:1}
.streak-label{font-size:10px;opacity:.72;letter-spacing:.1em}

/* body */
.body{padding:12px 20px 24px;display:flex;flex-direction:column;gap:18px}
.date-row{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.date-big{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:30px;letter-spacing:.08em}
.date-wd{color:#4A4E58;font-size:13px;letter-spacing:.1em}
.goals-box{display:flex;flex-direction:column;gap:8px}
.goal-line{font-size:13px;color:#4A4E58;border-left:2px solid #28407A;padding-left:10px;line-height:1.9}

.card{background:#fff;border:1px solid rgba(25,28,34,.14);border-radius:2px;padding:26px 22px 22px;position:relative}
.card::before{content:"";position:absolute;top:-1px;left:22px;width:44px;height:3px;background:#28407A}
.card.danger::before{background:#4A4E58}
.card-title{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:16.5px;letter-spacing:.08em;margin-bottom:8px}
.card-sub{font-size:12.5px;color:#4A4E58;margin-bottom:12px;line-height:1.9}

/* habits */
.action-row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:transparent;border:none;border-bottom:1px solid rgba(25,28,34,.1);
  padding:12px 2px;cursor:pointer;font-family:inherit;color:inherit;font-size:15px;
}
.action-row:last-of-type{border-bottom:none}
.stamp{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  border:1.5px solid rgba(40,64,122,.35);display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:16px;color:transparent;
  transition:all .25s cubic-bezier(.22,1,.36,1);
}
.stamp.pressed{border-color:#28407A;color:#F7F4EE;background:#28407A;box-shadow:0 4px 12px rgba(27,44,88,.24)}
.action-row.done .action-name{color:#4A4E58}
.action-name{font-weight:500;letter-spacing:.02em}
.all-done{margin-top:12px;font-family:'Shippori Mincho B1',serif;color:#28407A;font-size:13.5px;text-align:center;letter-spacing:.08em}

/* fields & buttons */
.fld{
  width:100%;border:1px solid rgba(25,28,34,.18);background:#fff;border-radius:2px;
  padding:12px 13px;font-size:15px;font-family:inherit;color:#191C22;margin-bottom:10px;
}
.fld:focus{outline:2px solid #28407A;outline-offset:1px;border-color:transparent}
textarea.fld{resize:vertical;min-height:64px;line-height:1.9}
.fld-label{display:block;font-size:12px;font-weight:700;color:#4A4E58;margin-bottom:6px;letter-spacing:.08em;margin-top:6px}
.btn-primary{
  width:100%;background:#28407A;color:#F7F4EE;border:none;border-radius:999px;
  padding:14px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.14em;transition:background .3s;
}
.btn-primary:hover{background:#1B2C58}
.btn-primary:disabled{opacity:.4;cursor:default}
.post-btn{margin-top:16px}
.btn-ghost{
  background:transparent;border:1px solid rgba(25,28,34,.18);border-radius:999px;padding:10px;
  font-family:inherit;font-size:13px;color:#4A4E58;cursor:pointer;width:100%;margin-bottom:10px;letter-spacing:.06em;
}
.btn-danger{width:100%;background:#7A2828;color:#fff;border:none;border-radius:999px;padding:12px;font-family:inherit;font-weight:700;cursor:pointer;letter-spacing:.1em}
.note{font-size:11.5px;color:#4A4E58;margin-top:10px;line-height:1.9}

/* stats */
.stat-band{display:flex;gap:1px;border-radius:2px;overflow:hidden}
.stat{flex:1;background:#191C22;color:#F7F4EE;padding:16px 8px 13px;text-align:center}
.stat-val{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:21px;color:#AEC0E8;line-height:1.2}
.stat-label{font-size:10px;opacity:.66;margin-top:4px;letter-spacing:.14em}

/* year grid */
.year-grid{display:flex;flex-direction:column;gap:5px}
.month-row{display:flex;align-items:center;gap:8px}
.month-label{width:32px;font-size:10px;color:#4A4E58;font-family:'Shippori Mincho B1',serif;flex-shrink:0;text-align:right;letter-spacing:.04em}
.day-cells{display:flex;gap:2px;flex-wrap:wrap}
.cell{width:8px;height:8px;border-radius:50%;display:inline-block}
.glegend{display:flex;gap:16px;font-size:11px;color:#4A4E58;margin-top:14px;justify-content:center;letter-spacing:.06em;flex-wrap:wrap}
.gd{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.gd-full{background:#28407A}
.gd-part{background:transparent;border:1.5px solid #28407A}
.gd-none{background:#EDEAE1}

/* habit rows */
.habit-row{padding:12px 0;border-bottom:1px solid rgba(25,28,34,.08)}
.habit-row:last-child{border-bottom:none}
.habit-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.habit-name{font-size:14px;font-weight:700;letter-spacing:.02em}
.habit-meta{font-size:11px;color:#4A4E58;white-space:nowrap}
.habit-meta em{font-style:normal;color:#B08A3E;font-weight:700}
.habit-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.hd{width:9px;height:9px;border-radius:50%;background:#EDEAE1;display:inline-block}
.hd.on{background:#28407A}

/* onboarding */
.onb{padding:52px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.onb-mark{width:56px;height:56px;margin-bottom:18px}
.onb-mark svg{width:100%;height:100%;display:block}
.onb-title{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:23px;letter-spacing:.16em;margin-bottom:6px}
.onb-tate{font-size:11px;letter-spacing:.4em;color:#28407A;font-weight:500;margin-bottom:16px}
.onb-lead{font-size:13px;color:#4A4E58;line-height:2.1;max-width:340px;margin-bottom:26px}
.onb-card{
  width:100%;max-width:360px;text-align:left;background:#fff;
  border:1px solid rgba(25,28,34,.14);border-radius:2px;padding:24px 20px;position:relative;
}
.onb-card::before{content:"";position:absolute;top:-1px;left:20px;width:44px;height:3px;background:#28407A}

/* tabs */
.tabs{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;display:flex;background:rgba(247,244,238,.96);
  backdrop-filter:blur(4px);
  border-top:1px solid rgba(25,28,34,.14);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:40;
}
.tab{
  flex:1;background:transparent;border:none;font-family:'Shippori Mincho B1',serif;
  font-weight:700;font-size:14px;letter-spacing:.2em;color:#4A4E58;padding:13px 4px;cursor:pointer;
  position:relative;transition:color .3s;
}
.tab.on{color:#28407A}
.tab.on::after{
  content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:#28407A;
}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:#1B2C58;color:#F7F4EE;padding:10px 20px;border-radius:999px;
  font-size:12.5px;letter-spacing:.06em;box-shadow:0 8px 24px rgba(27,44,88,.28);z-index:50;white-space:nowrap;
  max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}

/* v2: day head + mini ring */
.day-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 2px}
.day-sub{font-size:11.5px;color:#4A4E58;letter-spacing:.04em;margin-top:5px}
.mini-ring{position:relative;width:66px;height:66px;flex-shrink:0}
.mini-ring svg{width:100%;height:100%;display:block}
.mini-ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.mini-ring-txt small{font-size:10px;font-weight:500;color:#4A4E58;margin-left:1px}
.mini-ring.gold .mini-ring-txt{color:#B08A3E}

/* v2: habit rows with streak */
.action-body{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.action-streak{font-size:10.5px;color:#B08A3E;font-weight:700;letter-spacing:.06em}
.card-done::before{background:#B08A3E}

/* v2: completion panel */
.done-panel{text-align:center}
.done-panel::before{background:#B08A3E}
.done-mark{width:46px;height:46px;border-radius:50%;background:#B08A3E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px}
.done-panel .btn-ghost{margin-top:4px}

/* v2: goals fold */
.goals-fold{border-top:1px solid rgba(25,28,34,.12);padding-top:14px}
.goals-fold summary{cursor:pointer;list-style:none;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:13.5px;letter-spacing:.08em;color:#4A4E58;position:relative;padding-right:20px}
.goals-fold summary::-webkit-details-marker{display:none}
.goals-fold summary::after{content:"";position:absolute;right:4px;top:.36em;width:8px;height:8px;border-right:1.5px solid #28407A;border-bottom:1.5px solid #28407A;transform:rotate(45deg);transition:transform .3s}
.goals-fold[open] summary::after{transform:rotate(-135deg);top:.6em}
.goals-fold .goals-box{margin-top:12px}

/* v2: tab indicators */
.tab{display:flex;align-items:center;justify-content:center;gap:5px}
.tab-dot{width:5px;height:5px;border-radius:50%;background:rgba(40,64,122,.42);display:inline-block}
.tab.on .tab-dot{background:#28407A}
.tab-badge{min-width:17px;height:17px;border-radius:999px;background:#7A2828;color:#fff;font-family:'Zen Kaku Gothic New',sans-serif;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;letter-spacing:0}
.tab.on::after{bottom:4px}

/* v3: journal in habit tab */
.opt-tag{font-size:10px;font-weight:500;letter-spacing:.1em;color:#4A4E58;border:1px solid rgba(25,28,34,.2);border-radius:999px;padding:2px 8px;margin-left:9px;vertical-align:2px;font-family:'Zen Kaku Gothic New',sans-serif}

/* v3: journal review */
.jrv-list{margin-top:20px}
.jrv-month{margin-bottom:18px}
.jrv-month-label{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:13px;letter-spacing:.08em;color:#28407A;padding-bottom:7px;border-bottom:1px solid rgba(25,28,34,.12);display:flex;justify-content:space-between;align-items:baseline}
.jrv-month-label span{font-size:10.5px;color:#4A4E58;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;letter-spacing:.06em}
.jrv{border-bottom:1px solid rgba(25,28,34,.07)}
.jrv summary{cursor:pointer;list-style:none;padding:11px 18px 11px 0;display:flex;gap:11px;align-items:baseline;position:relative}
.jrv summary::-webkit-details-marker{display:none}
.jrv summary::after{content:"";position:absolute;right:3px;top:1.15em;width:7px;height:7px;border-right:1.4px solid rgba(40,64,122,.5);border-bottom:1.4px solid rgba(40,64,122,.5);transform:rotate(45deg);transition:transform .25s}
.jrv[open] summary::after{transform:rotate(-135deg);top:1.35em}
.jrv-date{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:12.5px;color:#B08A3E;flex-shrink:0;min-width:34px}
.jrv-peek{font-size:12px;color:#4A4E58;line-height:1.7;overflow:hidden}
.jrv-body{padding:2px 0 14px}
.jrv-q{font-size:11px;font-weight:700;color:#28407A;letter-spacing:.04em;margin-top:10px}
.jrv-a{font-size:13px;color:#191C22;line-height:2;margin-top:3px;white-space:pre-wrap}

/* v3: journal stars */
.stars{display:flex;align-items:center;gap:5px;margin:2px 0 16px}
.star{width:34px;height:34px;padding:0;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.star svg{width:26px;height:26px;fill:none;stroke:rgba(40,64,122,.35);stroke-width:1.6;transition:all .18s ease}
.star.on svg{fill:#B08A3E;stroke:#B08A3E}
.star:hover svg{stroke:#B08A3E}
.star-clear{font-size:10.5px;color:#4A4E58;margin-left:6px;cursor:pointer;letter-spacing:.06em;text-decoration:underline;text-underline-offset:2px}
.jrv-stars{font-size:11px;color:#B08A3E;letter-spacing:.06em;flex-shrink:0}

/* v3: weather selector (心・体 それぞれフル幅1行) */
.w-line{display:flex;flex-direction:column;gap:6px;margin:2px 0 14px}
.w-unit{display:flex;align-items:center;gap:9px}
.w-label{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:13.5px;letter-spacing:.1em;color:#191C22;width:20px;flex-shrink:0}
.w-opts{display:flex;gap:6px;flex:1}
.w-opt{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 4px;border:1px solid rgba(25,28,34,.16);border-radius:2px;
  background:#fff;cursor:pointer;transition:all .18s ease;font-family:inherit;
}
.w-opt svg{width:22px;height:22px;flex-shrink:0}
.w-opt span{font-size:11.5px;color:#4A4E58;letter-spacing:.06em}
.w-opt .w-fill{fill:rgba(25,28,34,.2)}
.w-opt .w-stroke{stroke:rgba(25,28,34,.2);stroke-width:2;stroke-linecap:round}
.w-opt.on{border-color:#28407A;background:rgba(40,64,122,.07)}
.w-opt.on .w-fill{fill:#28407A}
.w-opt.on .w-stroke{stroke:#28407A}
.w-opt.on span{color:#28407A;font-weight:700}
.jr-ta{min-height:52px}

/* v3: weather grid */
.wg{margin-top:20px}
.wg-title{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:12.5px;letter-spacing:.1em;color:#28407A;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.wg-title span{font-family:'Zen Kaku Gothic New',sans-serif;font-size:10.5px;font-weight:500;color:#4A4E58;letter-spacing:.04em}

/* v3: weather icon in list */
.jrv-ws{display:inline-flex;gap:3px;flex-shrink:0;align-items:center}
.jrv-w svg{width:15px;height:15px;display:block}
.jrv-w .w-fill{fill:rgba(40,64,122,.62)}
.jrv-w .w-stroke{stroke:rgba(40,64,122,.62);stroke-width:2.2;stroke-linecap:round}

/* v3: TAV review list */
.tvr-list{margin-top:4px}
.tvr{border-bottom:1px solid rgba(25,28,34,.08)}
.tvr:last-child{border-bottom:none}
.tvr summary{cursor:pointer;list-style:none;padding:11px 18px 11px 0;display:flex;gap:11px;align-items:baseline;position:relative}
.tvr summary::-webkit-details-marker{display:none}
.tvr summary::after{content:"";position:absolute;right:3px;top:1.15em;width:7px;height:7px;border-right:1.4px solid rgba(40,64,122,.5);border-bottom:1.4px solid rgba(40,64,122,.5);transform:rotate(45deg);transition:transform .25s}
.tvr[open] summary::after{transform:rotate(-135deg);top:1.35em}
.tvr-date{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:12px;color:#B08A3E;flex-shrink:0;min-width:32px}
.tvr-title{font-size:13px;font-weight:700;line-height:1.7;color:#191C22}
.tvr-body{padding:2px 0 14px}
.tvr-q{font-size:10px;font-weight:700;letter-spacing:.14em;color:#B08A3E;margin-top:9px}
.tvr-a{font-size:12.5px;color:#191C22;line-height:1.95;margin-top:3px;white-space:pre-wrap}

/* v3: day switch (昨日編集) */
.day-switch{display:flex;gap:6px;margin:2px 0 4px}
.dsw{background:transparent;border:1px solid rgba(25,28,34,.16);border-radius:999px;padding:6px 16px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:12px;letter-spacing:.1em;color:#4A4E58;cursor:pointer}
.dsw.on{background:#28407A;border-color:#28407A;color:#F7F4EE}
.yst-tag{font-size:10px;font-weight:700;letter-spacing:.1em;background:#B08A3E;color:#fff;border-radius:999px;padding:3px 9px;margin-left:9px;vertical-align:3px;font-family:'Zen Kaku Gothic New',sans-serif}

/* v3: settings habit rows */
.st-hrow{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.st-hrow .fld{margin-bottom:0;flex:1}
.st-hmove{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.st-mv{width:26px;height:19px;border:1px solid rgba(25,28,34,.16);background:#fff;border-radius:2px;font-size:8px;color:#28407A;cursor:pointer;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
.st-mv:disabled{opacity:.28;cursor:default}
.st-hdel{width:28px;height:28px;border:none;background:transparent;color:rgba(25,28,34,.32);font-size:19px;cursor:pointer;padding:0;flex-shrink:0;line-height:1}
.st-hdel:hover:not(:disabled){color:#7A2828}
.st-hdel:disabled{opacity:.2;cursor:default}

/* header menu */
.top-right{display:flex;align-items:center;gap:8px;position:relative}
.menu-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(25,28,34,.16);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.menu-btn svg{width:19px;height:19px}
.menu-pop{position:absolute;top:44px;right:0;background:#fff;border:1px solid rgba(25,28,34,.16);border-radius:2px;box-shadow:0 10px 30px rgba(25,28,34,.16);z-index:60;min-width:172px;overflow:hidden}
.menu-item{display:block;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid rgba(25,28,34,.08);padding:14px 18px;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:14px;letter-spacing:.06em;color:#191C22;cursor:pointer}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{background:#F7F4EE}

/* overlay pages */
.ov{min-height:100vh;background:#F7F4EE}
.ov-bar{display:flex;align-items:center;gap:12px;padding:18px 20px 6px;position:sticky;top:0;background:rgba(247,244,238,.96);backdrop-filter:blur(4px);z-index:30}
.ov-back{width:36px;height:36px;border-radius:50%;border:1px solid rgba(25,28,34,.16);background:transparent;font-size:16px;color:#191C22;cursor:pointer;line-height:1}
.ov-title{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:17px;letter-spacing:.12em}

/* journal */
.chk{display:flex;align-items:center;gap:9px;margin:4px 0 14px;font-size:13px;color:#4A4E58;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#28407A;cursor:pointer}
.jr-past{padding:12px 0;border-bottom:1px solid rgba(25,28,34,.08)}
.jr-past:last-child{border-bottom:none}
.jr-past-date{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:12.5px;color:#28407A;letter-spacing:.06em}
.jr-past-body{font-size:12.5px;color:#4A4E58;line-height:1.9;margin-top:4px}

/* TAV */
.chips{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid rgba(25,28,34,.18);border-radius:999px;padding:7px 13px;font-family:inherit;font-size:11.5px;color:#4A4E58;cursor:pointer;letter-spacing:.04em}
.chip.on{background:#28407A;border-color:#28407A;color:#F7F4EE;font-weight:700}

.celebrate-card{background:#F7F4EE;border-radius:2px;border:1px solid rgba(25,28,34,.2);padding:52px 40px 40px;text-align:center;max-width:340px;width:100%;position:relative}
.celebrate-card::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:80px;height:4px;background:#B08A3E}

@media (prefers-reduced-motion: reduce){ .stamp,.tab{transition:none} }
</style>

<body>
<div id="app"></div>

<script>
/* =========================================================
   ★ 管理者設定（清水さんがデプロイ前にここだけ編集）
   SlackのIncoming Webhook URLを「base64に変換して」貼り付けます。
   （公開リポジトリではURLを直接書くとSlack側で自動無効化されるため）

   変換方法：ブラウザで F12 → Console を開き、次を実行してコピー
     btoa("https://hooks.slack.com/services/T000/B000/XXXX")

   例: const SLACK_WEBHOOK_B64 = "aHR0cHM6Ly9ob29rcy5zbGFjay5jb20v...";
========================================================= */
const SLACK_WEBHOOK_B64 = "aHR0cHM6Ly9ob29rcy5zbGFjay5jb20vc2VydmljZXMvVDBBNVFQQ01FQTEvQjBCRlhTNEhOOFovRUdDU1Vzc3gzRVJwaWJkcEdJTTM2bU1H";

const SLACK_WEBHOOK = SLACK_WEBHOOK_B64 ? atob(SLACK_WEBHOOK_B64) : "";

/* ---------- helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const DAY_SHIFT_MS = 3 * 3600 * 1000; // 深夜3時までは前日としてカウント
const appNow = () => new Date(Date.now() - DAY_SHIFT_MS);
const todayKey = () => keyFromDate(appNow());
function keyFromDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dateFromKey(k) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
}
const daysBetween = (a, b) => Math.floor((b - a) / 86400000);

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function persist() {
  localStorage.setItem("circle_profile", JSON.stringify(profile));
  localStorage.setItem("circle_logs", JSON.stringify(logs));
  localStorage.setItem("circle_journals", JSON.stringify(journals));
  localStorage.setItem("circle_tavs", JSON.stringify(tavs));
}
const prefersReduced = () => {
  try { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch (e) { return false; }
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- state ---------- */
let profile = load("circle_profile");
let logs = load("circle_logs") || {};
let journals = load("circle_journals") || {};
let tavs = load("circle_tavs") || [];
let tab = "habit";
let menuOpen = false;
let overlay = null;   // "review" | "settings" | null
let tavFilter = "active";
let editYesterday = false;
let toastTimer = null;
let ringAnimated = false;

const MILESTONES = [7, 30, 66, 100, 200, 365];

const WEATHER = [
  { id: "sun",   label: "晴れ", emoji: ":sunny:" },
  { id: "cloud", label: "曇り", emoji: ":cloud:" },
  { id: "rain",  label: "雨",   emoji: ":umbrella_with_rain_drops:" },
];
const WEATHER_COLOR = { sun: "#28407A", cloud: "rgba(40,64,122,.42)", rain: "rgba(40,64,122,.16)" };

const JOURNAL_QUESTIONS = [
  { id: "q1", label: "今日、心が動いたのはどんな場面だった？" },
  { id: "q2", label: "そのとき、どんな感情だった？" },
  { id: "q3", label: "明日、ひとつだけ変えるとしたら？" },
];

const webhookUrl = () => SLACK_WEBHOOK;

/* ---------- stats ---------- */
function computeStats() {
  const start = dateFromKey(profile.startDate);
  const now = dateFromKey(todayKey());
  const elapsed = Math.max(1, daysBetween(start, now) + 1);
  const nHabits = profile.habits.length || 1;
  let totalDone = 0, stampedDays = 0;
  Object.values(logs).forEach((v) => {
    const done = (v.done || []).length;
    totalDone += done;
    if (done > 0) stampedDays++;
  });
  let streak = 0;
  const cur = new Date(now);
  for (;;) {
    const key = keyFromDate(cur);
    if (logs[key] && (logs[key].done || []).length > 0) {
      streak++; cur.setDate(cur.getDate() - 1);
    } else {
      if (key === todayKey()) { cur.setDate(cur.getDate() - 1); continue; }
      break;
    }
  }
  const rate = Math.round(totalDone / (nHabits * elapsed) * 100);
  return { elapsed, rate: Math.min(100, rate), streak, stampedDays };
}

function computeHabitStats(habitId) {
  const start = dateFromKey(profile.startDate);
  const now = dateFromKey(todayKey());
  const elapsed = Math.max(1, daysBetween(start, now) + 1);
  let doneDays = 0;
  Object.values(logs).forEach((v) => { if ((v.done || []).includes(habitId)) doneDays++; });
  let streak = 0;
  const cur = new Date(now);
  for (;;) {
    const key = keyFromDate(cur);
    if (logs[key] && (logs[key].done || []).includes(habitId)) {
      streak++; cur.setDate(cur.getDate() - 1);
    } else {
      if (key === todayKey()) { cur.setDate(cur.getDate() - 1); continue; }
      break;
    }
  }
  return { streak, rate: Math.min(100, Math.round(doneDays / elapsed * 100)) };
}

/* ---------- Slack ---------- */
function sendSlack(text) {
  const url = webhookUrl();
  if (!url) return Promise.resolve(false);
  // Incoming WebhookはCORSヘッダを返さないため no-cors で送信（結果は不透明）
  return fetch(url, { method: "POST", mode: "no-cors", body: JSON.stringify({ text }) })
    .then(() => true)
    .catch(() => false);
}

function showToast(msg) {
  const old = $(".toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3500);
}


/* ---------- month ring (①) ---------- */
function yearRingHTML(s) {
  const now = appNow();
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  let monthDays = 0;
  for (let i = 1; i <= dim; i++) {
    const k = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
    if (logs[k] && (logs[k].done || []).length > 0) monthDays++;
  }
  const progress = Math.min(1, monthDays / dim);
  const R = 120, C = 2 * Math.PI * R;
  const shownOff = ringAnimated ? C * (1 - progress) : C;
  const ang = -Math.PI / 2 + (ringAnimated ? progress : 0) * 2 * Math.PI;
  const hx = (150 + Math.cos(ang) * R).toFixed(1), hy = (150 + Math.sin(ang) * R).toFixed(1);
  let ticks = "";
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * 2 * Math.PI - Math.PI / 2;
    const gold = (i === 0 && progress >= 1) || (i > 0 && progress >= i / 4);
    const x1 = (150 + Math.cos(a) * (R - 11)).toFixed(1), y1 = (150 + Math.sin(a) * (R - 11)).toFixed(1);
    const x2 = (150 + Math.cos(a) * (R + 13)).toFixed(1), y2 = (150 + Math.sin(a) * (R + 13)).toFixed(1);
    ticks += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' +
      (gold ? "#B08A3E" : "rgba(40,64,122,.28)") + '" stroke-width="' + (gold ? 3.5 : 1.5) + '"/>';
  }
  return '<div class="ring-wrap" id="year-ring" data-progress="' + progress + '">' +
    '<svg viewBox="0 0 300 300" aria-label="一年の進捗リング">' +
    '<circle cx="150" cy="150" r="' + R + '" fill="none" stroke="rgba(40,64,122,.13)" stroke-width="6"/>' +
    ticks +
    '<circle id="yr-arc" cx="150" cy="150" r="' + R + '" fill="none" stroke="#28407A" stroke-width="8" stroke-linecap="round" transform="rotate(-90 150 150)" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + shownOff.toFixed(1) + '"/>' +
    '<circle id="yr-head" cx="' + hx + '" cy="' + hy + '" r="9" fill="#28407A"/>' +
    '</svg>' +
    '<div class="ring-center"><div class="ring-pct">' + (progress * 100).toFixed(1) + '<small>%</small></div>' +
    '<div class="ring-days">' + (now.getMonth() + 1) + '月 ' + monthDays + '／' + dim + '日を記録</div></div></div>';
}

function animateYearRing() {
  const wrap = $("#year-ring");
  if (!wrap || ringAnimated) return;
  ringAnimated = true;
  const progress = parseFloat(wrap.dataset.progress) || 0;
  const arc = $("#yr-arc"), head = $("#yr-head");
  const R = 120, C = 2 * Math.PI * R;
  const setAt = (p) => {
    arc.style.strokeDashoffset = C * (1 - p);
    const a = -Math.PI / 2 + p * 2 * Math.PI;
    head.setAttribute("cx", 150 + Math.cos(a) * R);
    head.setAttribute("cy", 150 + Math.sin(a) * R);
  };
  if (prefersReduced()) { setAt(progress); return; }
  const t0 = performance.now(), dur = 1600;
  function frame(t) {
    const p = Math.min((t - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    setAt(progress * e);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- milestone celebration (⑤) ---------- */
function showCelebration(m) {
  const el = document.createElement("div");
  el.className = "celebrate";
  el.innerHTML = '<div class="celebrate-card">' +
    '<div class="celebrate-kicker">MILESTONE</div>' +
    '<div class="celebrate-num">' + m + '<small>日</small></div>' +
    '<div class="celebrate-label">投稿 ' + m + '日連続を達成</div>' +
    '<p class="celebrate-msg">静かに、確かに、積み重なっています。<br>この調子で。</p>' +
    '<p class="celebrate-close">タップして閉じる</p></div>';
  el.onclick = () => el.remove();
  document.body.appendChild(el);
}

/* ---------- monthly record card (⑥) ---------- */
async function generateCard() {
  try { await document.fonts.ready; } catch (e) {}
  const now = appNow();
  const y = now.getFullYear(), mo = now.getMonth();
  const dim = new Date(y, mo + 1, 0).getDate();
  const nHabits = profile.habits.length || 1;

  let recDays = 0, fullDays = 0, best = 0, run = 0;
  const days = [];
  for (let i = 1; i <= dim; i++) {
    const k = y + "-" + String(mo + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
    const v = logs[k];
    const ratio = v ? (v.done || []).length / nHabits : 0;
    const future = dateFromKey(k) > now;
    days.push({ ratio, future });
    if (!future) {
      if (ratio > 0) { recDays++; run++; best = Math.max(best, run); if (ratio >= 1) fullDays++; }
      else run = 0;
    }
  }

  const W = 1080, H = 1080;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const mincho = "'Shippori Mincho B1', serif";
  const gothic = "'Zen Kaku Gothic New', sans-serif";

  x.fillStyle = "#F7F4EE"; x.fillRect(0, 0, W, H);

  // logo ring + wordmark
  x.strokeStyle = "#28407A"; x.lineWidth = 7; x.lineCap = "round";
  x.beginPath(); x.arc(124, 118, 34, -Math.PI / 2 + 0.55, -Math.PI / 2 + 2 * Math.PI - 0.25); x.stroke();
  x.fillStyle = "#28407A"; x.beginPath(); x.arc(124, 84, 8, 0, 2 * Math.PI); x.fill();
  x.fillStyle = "#191C22"; x.textBaseline = "middle";
  x.font = "700 44px " + mincho;
  x.fillText("Daily Circle", 184, 120);

  x.strokeStyle = "rgba(25,28,34,.16)"; x.lineWidth = 2;
  x.beginPath(); x.moveTo(90, 186); x.lineTo(W - 90, 186); x.stroke();

  // title & name
  x.fillStyle = "#191C22"; x.font = "800 88px " + mincho;
  x.fillText(y + "年" + (mo + 1) + "月の記録", 90, 286);
  x.fillStyle = "#4A4E58"; x.font = "500 40px " + gothic;
  x.fillText(profile.name, 90, 372);
  x.fillStyle = "#28407A"; x.fillRect(90, 418, 88, 6);

  // dot grid (7 columns)
  const gx = 118, gy = 500, gapX = 140, gapY = 92, r = 28;
  days.forEach((d, i) => {
    const cx = gx + (i % 7) * gapX, cy = gy + Math.floor(i / 7) * gapY;
    x.setLineDash([]);
    if (d.future) {
      x.strokeStyle = "rgba(25,28,34,.2)"; x.lineWidth = 3; x.setLineDash([6, 8]);
      x.beginPath(); x.arc(cx, cy, r, 0, 2 * Math.PI); x.stroke(); x.setLineDash([]);
    } else if (d.ratio >= 1) {
      x.fillStyle = "#28407A"; x.beginPath(); x.arc(cx, cy, r, 0, 2 * Math.PI); x.fill();
    } else if (d.ratio > 0) {
      x.strokeStyle = "rgba(40,64,122," + (0.4 + d.ratio * 0.5).toFixed(2) + ")"; x.lineWidth = 6;
      x.beginPath(); x.arc(cx, cy, r - 3, 0, 2 * Math.PI); x.stroke();
    } else {
      x.fillStyle = "#EDEAE1"; x.beginPath(); x.arc(cx, cy, r, 0, 2 * Math.PI); x.fill();
    }
  });

  // stats
  x.fillStyle = "#191C22"; x.font = "700 38px " + mincho;
  x.fillText("記録 " + recDays + "日　　すべて達成 " + fullDays + "日　　最長 " + best + "日連続", 90, 962);

  // footer
  x.fillStyle = "#B08A3E"; x.font = "600 24px " + mincho;
  try { x.letterSpacing = "8px"; } catch (e) {}
  x.fillText("DAILY CIRCLE — " + y, 90, 1022);
  try { x.letterSpacing = "0px"; } catch (e) {}

  const a = document.createElement("a");
  a.download = "daily-circle-" + y + "-" + String(mo + 1).padStart(2, "0") + ".png";
  a.href = cv.toDataURL("image/png");
  a.click();
  showToast("記録カードを保存しました");
}


/* ---------- weekly report ---------- */
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // 月曜起点
  return x;
}

function weeklyReportMsg() {
  const M = mondayOf(appNow());
  const wk = keyFromDate(M);
  if ((profile.lastWeeklyReport || "") === wk) return null;
  const prevM = new Date(M); prevM.setDate(prevM.getDate() - 7);
  if (dateFromKey(profile.startDate) > new Date(M.getTime() - 1)) return null; // 先週より後に開始した人はスキップ
  const dayKeys = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(prevM); d.setDate(d.getDate() + i);
    dayKeys.push(keyFromDate(d));
  }
  let recDays = 0;
  dayKeys.forEach((k) => { if (logs[k] && (logs[k].done || []).length > 0) recDays++; });
  const lines = profile.habits.map((h) => {
    let row = "", n = 0;
    dayKeys.forEach((k) => {
      const on = logs[k] && (logs[k].done || []).includes(h.id);
      row += on ? ":large_blue_circle:" : ":white_circle:";
      if (on) n++;
    });
    return row + " " + h.name + "（" + n + "/7）";
  }).join("\n");
  const fmt = (k) => { const p = k.split("-"); return Number(p[1]) + "/" + Number(p[2]); };
  return {
    wk,
    text: ":bar_chart: 【Daily Circle】" + profile.name + " さんの先週のふりかえり（" +
      fmt(dayKeys[0]) + "〜" + fmt(dayKeys[6]) + "・月〜日）\n" + lines +
      "\n:pencil: 記録した日 " + recDays + "/7日"
  };
}

/* ---------- actions ---------- */
function toggleHabit(habitId) {
  const key = targetKey();
  const day = logs[key] || { done: [] };
  const wasDone = day.done.includes(habitId);
  day.done = wasDone ? day.done.filter((x) => x !== habitId) : [...day.done, habitId];
  logs[key] = day;
  persist();
  render();
}

function postToday() {
  const key = targetKey();
  const day = logs[key] || { done: [] };
  if (day.done.length === 0) { showToast("まずは今日の習慣にチェックを入れてください"); return; }
  const s = computeStats();
  const lines = profile.habits.map((h) => {
    if (day.done.includes(h.id)) {
      const hs = computeHabitStats(h.id);
      return ":white_check_mark: " + h.name + "（" + hs.streak + "日連続）";
    }
    return ":white_large_square: " + h.name;
  }).join("\n");
  const isUpdate = !!day.posted;
  const celebrated = profile.celebrated || [];
  const milestone = (MILESTONES.includes(s.streak) && !celebrated.includes(s.streak)) ? s.streak : null;
  const dd = dateFromKey(key);
  const dayLabel = editYesterday
    ? "の記録（" + (dd.getMonth() + 1) + "/" + dd.getDate() + "・後から記録）"
    : "さんの今日の記録".slice(3);
  const msg = ":large_blue_circle: 【Daily Circle】" + profile.name + " さん" +
    (editYesterday ? dayLabel : "の今日の記録") +
    (isUpdate ? "（更新）" : "") + "\n" + lines +
    "\n:fire: 投稿" + s.streak + "日連続中" +
    (milestone ? "\n:tada: :confetti_ball: 祝・投稿" + milestone + "日連続を達成！ :confetti_ball: :tada:" : "");
  sendSlack(msg).then((ok) => {
    if (ok) {
      day.posted = true;
      logs[key] = day;
      if (milestone) profile.celebrated = [...celebrated, milestone];
      persist();
      render();
      if (milestone) showCelebration(milestone);
      showToast(isUpdate ? "Slackに再投稿しました" : "Slackに投稿しました");
      const wr = weeklyReportMsg();
      if (wr) {
        sendSlack(wr.text).then((ok2) => {
          if (ok2) {
            profile.lastWeeklyReport = wr.wk;
            persist();
            showToast("先週のふりかえりも投稿しました");
          }
        });
      }
    } else {
      showToast("投稿に失敗しました。通信環境を確認してください");
    }
  });
}


/* ---------- journal actions ---------- */
function saveJournal() {
  const key = todayKey();
  const entry = journals[key] || {};
  let any = false;
  document.querySelectorAll(".jr-field").forEach((el) => {
    entry[el.dataset.q] = el.value.trim();
    if (el.value.trim()) any = true;
  });
  if (!any) { showToast("ひとつでも書いてから保存してください"); return; }
  document.querySelectorAll("[data-weather]").forEach((el) => {
    entry[el.dataset.weather] = el.dataset.val || "";
    if (el.dataset.val) any = true;
  });
  const starBox = $("#jr-stars");
  entry.stars = starBox ? Number(starBox.dataset.val || 0) : (entry.stars || 0);
  entry.savedAt = Date.now();
  const share = $("#jr-share") && $("#jr-share").checked;
  journals[key] = entry;
  persist();

  if (share && webhookUrl()) {
    const body = JOURNAL_QUESTIONS.map((q) => entry[q.id] ? "*" + q.label + "*\n" + entry[q.id] : "")
      .filter(Boolean).join("\n");
    const d = appNow();
    const st = entry.stars ? "\n" + ":star:".repeat(entry.stars) : "";
    const wOf = (id) => { const w = WEATHER.find((x) => x.id === id); return w ? w.emoji + " " + w.label : ""; };
    const wl = (entry.mind || entry.body)
      ? "\n心 " + (wOf(entry.mind) || "—") + "　体 " + (wOf(entry.body) || "—") : "";
    sendSlack(":writing_hand: 【Daily Circle】" + profile.name + " さんのジャーナル（" +
      (d.getMonth() + 1) + "/" + d.getDate() + "）" + st + wl + "\n" + body).then((ok) => {
      if (ok) { entry.posted = true; journals[key] = entry; persist(); }
      render();
      showToast(ok ? "保存してSlackに共有しました" : "保存しました（Slack共有に失敗）");
    });
  } else {
    entry.posted = false;
    journals[key] = entry;
    persist();
    render();
    showToast("保存しました");
  }
}

/* ---------- TAV actions ---------- */
function addTav() {
  const title = $("#tav-title").value.trim();
  if (!title) { showToast("気づきを入力してください"); return; }
  tavs.unshift({ id: uid(), title, memo: $("#tav-memo").value.trim(), decision: null, due: "", review: "", createdAt: todayKey() });
  persist();
  tavFilter = "active";
  render();
  showToast("気づきを追加しました");
}

function findTav(id) { return tavs.find((t) => t.id === id); }

function tavSetDue(id) {
  const t = findTav(id);
  if (!t) return;
  const def = t.due || (() => { const d = appNow(); d.setDate(d.getDate() + 7); return keyFromDate(d); })();
  openModal({
    title: "いつまでにやる？",
    body: '<label class="fld-label">期日</label><input class="fld" type="date" id="md-due" value="' + def + '">',
    okLabel: "決定する",
    onOk: () => {
      const v = $("#md-due").value;
      if (!v) { showToast("期日を選んでください"); return false; }
      t.decision = "yes"; t.due = v; t.completedAt = null; t.touchedAt = todayKey();
      persist(); render(); showToast("期日を設定しました");
    },
  });
}

function tavComplete(id) {
  const t = findTav(id);
  if (!t) return;
  openModal({
    title: "やってみて、どうだった？",
    body: '<textarea class="fld" id="md-review" placeholder="実行した結果と、そこから得たこと"></textarea>' +
      (webhookUrl()
        ? '<label class="chk" style="margin-bottom:14px"><input type="checkbox" id="md-share"><span>Slackに共有する</span></label>'
        : ''),
    okLabel: "完了にする",
    onOk: () => {
      const v = $("#md-review").value.trim();
      if (!v) { showToast("振り返りを書いてください"); return false; }
      const share = $("#md-share") && $("#md-share").checked;
      t.review = v; t.completedAt = todayKey(); t.decision = "yes"; t.touchedAt = todayKey();
      t.shared = !!share;
      persist(); render();
      if (share && webhookUrl()) {
        sendSlack(":bulb: 【Daily Circle】" + profile.name + " さんがTAVを実行しました\n" +
          "*気づき*：" + t.title + "\n*やってみて*：" + v).then((ok) =>
          showToast(ok ? "完了しました。Slackに共有しました" : "完了しました（Slack共有に失敗）"));
      } else showToast("完了しました");
    },
  });
}

function tavShare(id) {
  const t = findTav(id);
  if (!t || !webhookUrl()) return;
  sendSlack(":bulb: 【Daily Circle】" + profile.name + " さんがTAVを実行しました\n" +
    "*気づき*：" + t.title + "\n*やってみて*：" + t.review).then((ok) => {
    if (ok) { t.shared = true; persist(); render(); }
    showToast(ok ? "Slackに共有しました" : "共有に失敗しました");
  });
}

function tavSkip(id) {
  const t = findTav(id);
  if (!t) return;
  t.decision = "no"; t.due = ""; t.completedAt = null; t.touchedAt = todayKey();
  persist(); render(); showToast("「やらない」として記録しました");
}

function tavRevive(id) {
  const t = findTav(id);
  if (!t) return;
  t.decision = null;
  persist(); render();
}

function tavDelete(id) {
  openModal({
    title: "この気づきを削除しますか？",
    body: '<p class="card-sub">削除すると元に戻せません。「やらない」として残すこともできます。</p>',
    okLabel: "削除する",
    danger: true,
    onOk: () => { tavs = tavs.filter((t) => t.id !== id); persist(); render(); showToast("削除しました"); },
  });
}

/* ---------- modal ---------- */
function openModal({ title, body, okLabel, onOk, danger }) {
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = '<div class="modal-card"><h3 class="modal-title">' + title + '</h3>' + body +
    '<div class="modal-btns"><button class="btn-ghost" id="md-cancel">やめる</button>' +
    '<button class="' + (danger ? "btn-danger" : "btn-primary") + '" id="md-ok">' + okLabel + '</button></div></div>';
  document.body.appendChild(el);
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  el.querySelector("#md-cancel").onclick = () => el.remove();
  el.querySelector("#md-ok").onclick = () => { if (onOk() !== false) el.remove(); };
  const first = el.querySelector("input, textarea");
  if (first) first.focus();
}

function tavReviewHTML() {

/* ---------- weather grid (振り返り) ---------- */
function weatherGridHTML(kind, title) {
  const year = appNow().getFullYear();
  const today = appNow();
  const count = { sun: 0, cloud: 0, rain: 0 };
  let grid = "";
  for (let m = 0; m < 12; m++) {
    const dim = new Date(year, m + 1, 0).getDate();
    let cells = "";
    for (let i = 1; i <= dim; i++) {
      const k = year + "-" + String(m + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      const v = journals[k] && journals[k][kind];
      const future = dateFromKey(k) > today;
      if (v) count[v] = (count[v] || 0) + 1;
      const style = future ? "background:transparent;border:1px dashed rgba(25,28,34,.18)"
        : v ? "background:" + WEATHER_COLOR[v] + ";border:1px solid transparent"
        : "background:#EDEAE1;border:1px solid transparent";
      cells += '<span class="cell" style="' + style + '" title="' + k + '"></span>';
    }
    grid += '<div class="month-row"><span class="month-label">' + (m + 1) + '月</span><div class="day-cells">' + cells + '</div></div>';
  }
  const total = count.sun + count.cloud + count.rain;
  if (total === 0) return "";
  return '<div class="wg"><div class="wg-title">' + title +
    '<span>晴れ ' + count.sun + '・曇り ' + count.cloud + '・雨 ' + count.rain + '</span></div>' +
    '<div class="year-grid">' + grid + '</div></div>';
}

/* ---------- journal review (振り返りタブ) ---------- */
function journalReviewHTML() {
  const keys = Object.keys(journals).filter((k) => journals[k] && journals[k].savedAt).sort();
  if (keys.length === 0) {
    return '<section class="card"><h2 class="card-title">ジャーナルの記録</h2>' +
      '<p class="empty">まだジャーナルがありません。「習慣」タブから、今日の一日を書き留めてみましょう。</p></section>';
  }
  const year = appNow().getFullYear();
  const today = appNow();

  // 年間グリッド（記録した日）
  let grid = "";
  for (let m = 0; m < 12; m++) {
    const dim = new Date(year, m + 1, 0).getDate();
    let cells = "";
    for (let i = 1; i <= dim; i++) {
      const k = year + "-" + String(m + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      const has = journals[k] && journals[k].savedAt;
      const future = dateFromKey(k) > today;
      const style = future ? "background:transparent;border:1px dashed rgba(25,28,34,.18)"
        : has ? "background:#B08A3E;border:1px solid transparent"
        : "background:#EDEAE1;border:1px solid transparent";
      cells += '<span class="cell" style="' + style + '" title="' + k + '"></span>';
    }
    grid += '<div class="month-row"><span class="month-label">' + (m + 1) + '月</span><div class="day-cells">' + cells + '</div></div>';
  }

  // 月別グループ（新しい順・全文表示）
  const byMonth = {};
  keys.forEach((k) => {
    const ym = k.slice(0, 7);
    (byMonth[ym] = byMonth[ym] || []).push(k);
  });
  const months = Object.keys(byMonth).sort().reverse();
  const entries = months.map((ym) => {
    const p = ym.split("-");
    const rows = byMonth[ym].sort().reverse().map((k) => {
      const e = journals[k];
      const d = k.split("-");
      const body = JOURNAL_QUESTIONS.map((q) =>
        e[q.id] ? '<div class="jrv-q">' + q.label + '</div><div class="jrv-a">' + esc(e[q.id]) + '</div>' : ''
      ).join("");
      const stars = e.stars ? '<span class="jrv-stars">' + "★".repeat(e.stars) + '</span>' : '';
      const wIco = (id) => id ? '<span class="jrv-w w-' + id + '">' + weatherSVG(id) + '</span>' : '';
      const wSet = (e.mind || e.body) ? '<span class="jrv-ws">' + wIco(e.mind) + wIco(e.body) + '</span>' : '';
      return '<details class="jrv"><summary><span class="jrv-date">' + Number(d[1]) + '/' + Number(d[2]) + '</span>' + stars +
        '<span class="jrv-peek">' + esc((JOURNAL_QUESTIONS.map((q) => e[q.id]).filter(Boolean).join(" ／ ")).slice(0, 34)) + '…</span></summary>' +
        '<div class="jrv-body">' + body + '</div></details>';
    }).join("");
    return '<div class="jrv-month"><div class="jrv-month-label">' + p[0] + '年' + Number(p[1]) + '月' +
      '<span>' + byMonth[ym].length + '日</span></div>' + rows + '</div>';
  }).join("");

  return '<section class="card"><h2 class="card-title">ジャーナルの記録</h2>' +

/* ---------- mini ring ---------- */
function miniRingHTML() {
  const now = appNow();
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  let monthDays = 0;
  for (let i = 1; i <= dim; i++) {
    const k = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
    if (logs[k] && (logs[k].done || []).length > 0) monthDays++;
  }
  const progress = Math.min(1, monthDays / dim);
  const R = 34, C = 2 * Math.PI * R;
  const complete = allThreeDone();
  const col = complete ? "#B08A3E" : "#28407A";
  return '<div class="mini-ring' + (complete ? ' gold' : '') + '" id="mini-ring" data-progress="' + progress + '">' +
    '<svg viewBox="0 0 80 80">' +
    '<circle cx="40" cy="40" r="' + R + '" fill="none" stroke="rgba(40,64,122,.14)" stroke-width="5"/>' +
    '<circle id="mr-arc" cx="40" cy="40" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="6" stroke-linecap="round" transform="rotate(-90 40 40)" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/>' +
    '</svg><div class="mini-ring-txt">' + monthDays + '<small>/' + dim + '</small></div></div>';
}

function allThreeDone() {
  const k = todayKey();
  const posted = !!(logs[k] && logs[k].posted);
  const jr = !!(journals[k] && journals[k].savedAt);
  const tv = tavs.some((t) => t.completedAt === k || t.touchedAt === k);
  return posted && jr && tv;
}

function animateMiniRing() {
  const wrap = $("#mini-ring");
  if (!wrap || ringAnimated) return;
  ringAnimated = true;
  const progress = parseFloat(wrap.dataset.progress) || 0;
  const arc = $("#mr-arc");
  const C = 2 * Math.PI * 34;
  if (prefersReduced()) {
    arc.style.strokeDashoffset = C * (1 - progress); return;
  }
  const t0 = performance.now(), dur = 1100;
  (function frame(t) {
    const p = Math.min(((t || performance.now()) - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    arc.style.strokeDashoffset = C * (1 - progress * e);
    if (p < 1) requestAnimationFrame(frame);
  })(performance.now());
}

/* ---------- TAV view ---------- */
function tavStatus(t) {
  if (t.decision === "no") return "no";
  if (t.completedAt) return "done";
  if (!t.decision) return "new";
  if (t.due && dateFromKey(t.due) < dateFromKey(todayKey())) return "over";
  return "plan";
}
const TAV_LABEL = { new: "未判定", plan: "予定", over: "期限切れ", done: "完了", no: "やらない" };
const TAV_ORDER = { over: 0, plan: 1, new: 2, done: 3, no: 4 };

function tavView() {
  const list = tavs.map((t) => ({ t, s: tavStatus(t) }));
  const counts = { active: list.filter((x) => ["over","plan","new"].includes(x.s)).length,
                   done: list.filter((x) => x.s === "done").length,
                   no: list.filter((x) => x.s === "no").length };
  const shown = list.filter((x) =>
    tavFilter === "active" ? ["over","plan","new"].includes(x.s) :
    tavFilter === "done" ? x.s === "done" : x.s === "no"
  ).sort((a, b) => {
    if (TAV_ORDER[a.s] !== TAV_ORDER[b.s]) return TAV_ORDER[a.s] - TAV_ORDER[b.s];
    return (a.t.due || "9999") < (b.t.due || "9999") ? -1 : 1;
  });

  let items = "";
  if (shown.length === 0) {
    items = '<p class="empty">' + (tavFilter === "active"
      ? "まだ気づきがありません。月例会やふだんの会話で「これは真似したい」と思ったことを書き留めておきましょう。"
      : "該当する気づきはまだありません。") + '</p>';
  }
  shown.forEach(({ t, s }) => {
    const due = t.due ? (() => { const p = t.due.split("-"); return Number(p[1]) + "/" + Number(p[2]); })() : "";
    let actions = "";
    if (s === "new") {
      actions = '<div class="tav-actions"><button class="btn-ghost sm" data-tav-do="' + t.id + '">やる（期日を決める）</button>' +
        '<button class="btn-ghost sm" data-tav-skip="' + t.id + '">やらない</button></div>';
    } else if (s === "plan" || s === "over") {
      actions = '<div class="tav-actions"><button class="btn-ghost sm" data-tav-done="' + t.id + '">実行した</button>' +
        '<button class="btn-ghost sm" data-tav-do="' + t.id + '">期日を変える</button>' +
        '<button class="btn-ghost sm" data-tav-skip="' + t.id + '">やらない</button></div>';
    } else if (s === "no") {
      actions = '<div class="tav-actions"><button class="btn-ghost sm" data-tav-revive="' + t.id + '">やっぱりやる</button></div>';
    } else if (s === "done" && !t.shared && webhookUrl()) {
      actions = '<div class="tav-actions"><button class="btn-ghost sm" data-tav-share="' + t.id + '">Slackに共有する</button></div>';
    }
    items += '<div class="tav tav-' + s + '">' +
      '<div class="tav-head"><span class="tav-badge b-' + s + '">' + TAV_LABEL[s] + '</span>' +
      (due ? '<span class="tav-due">期日 ' + due + '</span>' : '') + '</div>' +
      '<div class="tav-title">' + esc(t.title) + '</div>' +
      (t.memo ? '<div class="tav-memo">' + esc(t.memo) + '</div>' : '') +
      (t.review ? '<div class="tav-review"><span>やってみて</span>' + esc(t.review) + '</div>' : '') +
      actions +
      '<button class="tav-del" data-tav-del="' + t.id + '" aria-label="削除">×</button>' +
      '</div>';
  });

  const chip = (k, label, n) =>
    '<button class="chip' + (tavFilter === k ? " on" : "") + '" data-tavfilter="' + k + '">' + label + ' ' + n + '</button>';

  return '<main class="body">' +
    '<section class="card"><h2 class="card-title">TAVを書き留める</h2>' +
    '<p class="card-sub">Takeaway Value — 人の話や日々の中で得た「これは真似したい」を、実行まで運ぶための場所です。</p>' +
    '<input class="fld" id="tav-title" placeholder="例：面談ではまず相手の原体験を聞く">' +
    '<textarea class="fld" id="tav-memo" placeholder="補足メモ（任意）"></textarea>' +
    '<button class="btn-primary" id="tav-add">気づきを追加する</button></section>' +
    '<section class="card"><div class="chips">' +
      chip("active", "実行中・未判定", counts.active) + chip("done", "完了", counts.done) + chip("no", "やらない", counts.no) +
    '</div>' + items + '</section></main>';
}

function recordView(stats) {
  const year = appNow().getFullYear();
  const nHabits = profile.habits.length || 1;
  const today = appNow();
  let grid = "";
  for (let m = 0; m < 12; m++) {
    const dim = new Date(year, m + 1, 0).getDate();
    let cells = "";
    for (let i = 1; i <= dim; i++) {
      const k = year + "-" + String(m + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      const v = logs[k];
      const ratio = v ? (v.done || []).length / nHabits : 0;
      const future = dateFromKey(k) > today;
      let style;
      if (future) style = "background:transparent;border:1px dashed rgba(25,28,34,.18)";
      else if (ratio >= 1) style = "background:#28407A;border:1px solid transparent";
      else if (ratio > 0) style = "background:transparent;border:1.5px solid rgba(40,64,122," + (0.4 + ratio * 0.5).toFixed(2) + ")";
      else style = "background:#EDEAE1;border:1px solid transparent";
      cells += '<span class="cell" style="' + style + '" title="' + k + '"></span>';
    }
    grid += '<div class="month-row"><span class="month-label">' + (m + 1) + '月</span><div class="day-cells">' + cells + '</div></div>';
  }

  const last28 = [];
  for (let i = 27; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    last28.push(keyFromDate(d));
  }
  let habitRows = "";
  profile.habits.forEach((h) => {
    const hs = computeHabitStats(h.id);
    const dots = last28.map((k) =>
      '<span class="hd' + ((logs[k] && (logs[k].done || []).includes(h.id)) ? " on" : "") + '" title="' + k + '"></span>'
    ).join("");
    habitRows += '<div class="habit-row"><div class="habit-head">' +
      '<span class="habit-name">' + esc(h.name) + '</span>' +
      '<span class="habit-meta"><em>連続 ' + hs.streak + '日</em>　達成率 ' + hs.rate + '%</span></div>' +
      '<div class="habit-dots">' + dots + '</div></div>';
  });

  return '<main class="body">' +
    '<div class="stat-band">' +
      '<div class="stat"><div class="stat-val">' + stats.rate + '%</div><div class="stat-label">累計達成率</div></div>' +
      '<div class="stat"><div class="stat-val">' + stats.streak + '日</div><div class="stat-label">連続日数</div></div>' +
      '<div class="stat"><div class="stat-val">' + stats.stampedDays + '日</div><div class="stat-label">記録した日</div></div>' +
    '</div>' +
    '<section class="card"><h2 class="card-title">' + year + '年の記録</h2>' +
    '<p class="card-sub">一つの点が一日。すべて達成した日は塗りつぶし、一部達成の日は輪郭のみで表示されます。</p>' +
    '<div class="year-grid">' + grid + '</div>' +
    '<div class="glegend"><span><i class="gd gd-full"></i> すべて達成</span><span><i class="gd gd-part"></i> 一部達成</span><span><i class="gd gd-none"></i> 未記録</span></div>' +
    '</section>' +
    '<section class="card"><h2 class="card-title">習慣ごとの歩み</h2>' +
    '<p class="card-sub">直近28日の記録です。どの習慣が続いているかを個別に確認できます。</p>' +
    habitRows + '</section>' +
    tavReviewHTML() +
    journalReviewHTML() +
    '<section class="card"><h2 class="card-title">今月の記録カード</h2>' +
    '<p class="card-sub">この月のドットと成績を1枚の画像（1080×1080）にまとめます。Slackやインスタでの共有用に。</p>' +
    '<button class="btn-primary" id="dl-card">' + (appNow().getMonth() + 1) + '月の記録カードを保存する</button>' +
    '<p class="note">スマホで保存されない場合は、開いた画像を長押しして「写真に保存」してください。</p>' +
    '</section></main>';
}

/* ---------- settings helper ---------- */
function collectSettings(validate) {
  const goals = [...document.querySelectorAll(".st-goal")].map((e) => e.value.trim()).filter(Boolean);
  const named = [...document.querySelectorAll(".st-habit")].map((e) => ({ id: e.dataset.hid, name: e.value.trim() }));
  if (validate) {
    if (goals.length === 0) { showToast("目標を1つ以上入力してください"); return false; }
    if (named.filter((h) => h.name).length === 0) { showToast("習慣を1つ以上入力してください"); return false; }
  }
  if (goals.length) profile.goals = goals.slice(0, 3);
  // 空欄の習慣は保存時のみ除外（編集途中は保持）
  profile.habits = validate ? named.filter((h) => h.name) : named;
  return true;
}

/* ---------- backup ---------- */
function exportData() {
  const payload = {
    app: "daily-circle", version: 1, exportedAt: new Date().toISOString(),
    profile, logs, journals, tavs,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "daily-circle-backup-" + todayKey() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast("記録を書き出しました");
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let d;
    try { d = JSON.parse(reader.result); } catch (e) { showToast("ファイルを読み込めませんでした"); return; }
    if (!d || d.app !== "daily-circle" || !d.profile) { showToast("Daily Circleのバックアップではありません"); return; }
    const days = Object.keys(d.logs || {}).length;
    openModal({
      title: "この内容で復元しますか？",
      body: '<p class="card-sub">' + esc(d.profile.name || "") + ' さんの記録（習慣 ' + days + '日ぶん・ジャーナル ' +
        Object.keys(d.journals || {}).length + '件・TAV ' + (d.tavs || []).length + '件）<br><br>' +
        '<strong>現在この端末にある記録は上書きされます。</strong></p>',
      okLabel: "復元する",
      danger: true,
      onOk: () => {
        profile = normalizeProfile(d.profile);
        logs = d.logs || {};
        journals = d.journals || {};
        tavs = d.tavs || [];
        persist();
        overlay = null; tab = "habit"; ringAnimated = false;
        render();
        showToast("記録を復元しました");
      },
    });
  };
  reader.readAsText(file);
}

function normalizeProfile(p) {
  if (!p) return p;
  const goals = p.goals || (p.goal ? [p.goal] : []);
  const habits = (p.habits || p.actions || []).map((h, i) =>
    typeof h === "string" ? { id: "a" + i, name: h } : h);
  return Object.assign({}, p, { goals, habits });
}

function tabsView() {
  const k = todayKey();
  const habitDot = !(logs[k] && logs[k].posted) || !(journals[k] && journals[k].savedAt);
  const tavCount = tavs.filter((t) => {
    const s = tavStatus(t);
    return s === "over" || (s === "plan" && t.due === k);
  }).length;

  const items = [
    ["habit", "習慣", habitDot ? "dot" : "", ""],
    ["tav", "TAV", "", tavCount ? String(tavCount) : ""],
    ["review", "振り返り", "", ""],
  ];
  return '<nav class="tabs">' + items.map(([key, label, dot, badge]) =>
    '<button class="tab' + (tab === key ? " on" : "") + '" data-tab="' + key + '">' + label +
    (badge ? '<span class="tab-badge">' + badge + '</span>' : (dot ? '<span class="tab-dot"></span>' : '')) +
    '</button>'
  ).join("") + '</nav>';
}

  const title = "設定";
  const inner = settingsView();
  return '<div class="ov"><div class="ov-bar"><button class="ov-back" id="ov-close">←</button>' +
    '<span class="ov-title">' + title + '</span></div>' + inner + '</div>';
}

/* ---------- render & bind ---------- */
function render() {
  const app = $("#app");
  if (!profile) { app.innerHTML = onbView(); bindOnb(); return; }
  const stats = computeStats();
  if (overlay) {
    app.innerHTML = overlayView(stats);
    bindApp();
    return;
  }
  let body = "";
  if (tab === "habit") body = habitView();
  else if (tab === "tav") body = tavView();
  else body = recordView(stats);
  app.innerHTML = headerView(stats) + body + tabsView();
  bindApp();
}

function bindOnb() {
  $("#ob-add-goal").onclick = () => {
    const box = $("#ob-goals");
    if (box.children.length >= 3) return;
    const t = document.createElement("textarea");
    t.className = "fld"; t.placeholder = "目標 " + (box.children.length + 1);
    box.appendChild(t);
    if (box.children.length >= 3) $("#ob-add-goal").style.display = "none";
  };
  $("#ob-add-habit").onclick = () => {
    const box = $("#ob-habits");
    if (box.children.length >= 5) return;
    const t = document.createElement("input");
    t.className = "fld"; t.placeholder = "習慣 " + (box.children.length + 1);
    box.appendChild(t);
    if (box.children.length >= 5) $("#ob-add-habit").style.display = "none";
  };
  $("#ob-start").onclick = () => {
    const name = $("#ob-name").value.trim();
    const goals = [...$("#ob-goals").children].map((e) => e.value.trim()).filter(Boolean);
    const habits = [...$("#ob-habits").children].map((e) => e.value.trim()).filter(Boolean);
    if (!name) { showToast("名前を入力してください"); return; }
    if (goals.length === 0) { showToast("目標を1つ以上入力してください"); return; }
    if (habits.length === 0) { showToast("習慣を1つ以上入力してください"); return; }
    profile = {
      name, goals,
      habits: habits.slice(0, 5).map((n, i) => ({ id: "a" + i, name: n })),
      startDate: todayKey(),
    };
    persist();
    render();
  };
}

function bindApp() {
  try {
  document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; menuOpen = false; ringAnimated = false; editYesterday = false; render(); }));

  // header menu
  const mb = $("#menu-btn");
  if (mb) mb.onclick = (e) => { e.stopPropagation(); menuOpen = !menuOpen; render(); };
  document.querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => {
    overlay = b.dataset.open; menuOpen = false; ringAnimated = false; render();
  }));
  if (menuOpen) document.onclick = () => { menuOpen = false; document.onclick = null; render(); };
  const ovc = $("#ov-close");
  if (ovc) ovc.onclick = () => { overlay = null; ringAnimated = false; render(); };

  // journal
  const js = $("#jr-save");
  if (js) js.onclick = saveJournal;
  document.querySelectorAll("[data-weather]").forEach((box) => {
    box.querySelectorAll(".w-opt").forEach((b) => (b.onclick = () => {
      const v = b.dataset.w;
      const next = box.dataset.val === v ? "" : v;   // 同じものを再タップで解除
      box.dataset.val = next;
      box.querySelectorAll(".w-opt").forEach((x) => x.classList.toggle("on", x.dataset.w === next));
    }));
  });
  const starBox = $("#jr-stars");
  if (starBox) {
    const paint = (v) => {
      starBox.dataset.val = v;
      starBox.querySelectorAll(".star").forEach((s) =>
        s.classList.toggle("on", Number(s.dataset.star) <= v));
      const cl = $("#jr-star-clear");
      if (cl) cl.textContent = v ? "クリア" : "";
    };
    starBox.querySelectorAll(".star").forEach((s) =>
      (s.onclick = () => paint(Number(s.dataset.star))));
    const cl = $("#jr-star-clear");
    if (cl) cl.onclick = () => paint(0);
  }

  // TAV
  const ta = $("#tav-add");
  if (ta) ta.onclick = addTav;
  document.querySelectorAll("[data-tavfilter]").forEach((b) => (b.onclick = () => { tavFilter = b.dataset.tavfilter; render(); }));
  document.querySelectorAll("[data-tav-do]").forEach((b) => (b.onclick = () => tavSetDue(b.dataset.tavDo)));
  document.querySelectorAll("[data-tav-done]").forEach((b) => (b.onclick = () => tavComplete(b.dataset.tavDone)));
  document.querySelectorAll("[data-tav-skip]").forEach((b) => (b.onclick = () => tavSkip(b.dataset.tavSkip)));
  document.querySelectorAll("[data-tav-share]").forEach((b) => (b.onclick = () => tavShare(b.dataset.tavShare)));
  document.querySelectorAll("[data-tav-revive]").forEach((b) => (b.onclick = () => tavRevive(b.dataset.tavRevive)));
  document.querySelectorAll("[data-tav-del]").forEach((b) => (b.onclick = () => tavDelete(b.dataset.tavDel)));

  document.querySelectorAll(".action-row").forEach((b) => (b.onclick = () => toggleHabit(b.dataset.habit)));
  const post = $("#post-today");
  if (post) post.onclick = postToday;
  if ($("#year-ring")) animateYearRing();
  if ($("#mini-ring")) animateMiniRing();
  document.querySelectorAll("[data-day]").forEach((b) => (b.onclick = () => {
    editYesterday = b.dataset.day === "yesterday";
    ringAnimated = false; render();
  }));
  document.querySelectorAll("[data-goto]").forEach((b) => (b.onclick = () => { tab = b.dataset.goto; ringAnimated = false; render(); }));
  const dl = $("#dl-card");
  if (dl) dl.onclick = generateCard;
  } catch (e) { console.error("bindApp:", e); }

  const addGoal = $("#st-add-goal");
  if (addGoal) addGoal.onclick = () => {
    const box = $("#st-goals");
    if (box.children.length >= 3) return;
    const t = document.createElement("textarea");
    t.className = "fld st-goal"; t.placeholder = "目標 " + (box.children.length + 1);
    box.appendChild(t);
    if (box.children.length >= 3) addGoal.style.display = "none";
  };
  const addHabit = $("#st-add-habit");
  if (addHabit) addHabit.onclick = () => {
    if (profile.habits.length >= 5) return;
    collectSettings();
    profile.habits.push({ id: uid(), name: "" });
    persist(); render();
  };
  document.querySelectorAll("[data-mv]").forEach((b) => (b.onclick = () => {
    collectSettings();
    const i = Number(b.dataset.i), j = b.dataset.mv === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= profile.habits.length) return;
    const t = profile.habits[i]; profile.habits[i] = profile.habits[j]; profile.habits[j] = t;
    persist(); render();
  }));
  document.querySelectorAll("[data-hdel]").forEach((b) => (b.onclick = () => {
    if (profile.habits.length <= 1) return;
    const id = b.dataset.hdel;
    const h = profile.habits.find((x) => x.id === id);
    openModal({
      title: "この習慣を削除しますか？",
      body: '<p class="card-sub">「' + esc(h ? h.name : "") + '」を一覧から外します。過去の記録は残りますが、今後の記録対象ではなくなります。</p>',
      okLabel: "削除する", danger: true,
      onOk: () => {
        collectSettings();
        profile.habits = profile.habits.filter((x) => x.id !== id);
        persist(); render(); showToast("習慣を削除しました");
      },
    });
  }));

  const exp = $("#st-export");
  if (exp) exp.onclick = exportData;
  const imp = $("#st-import"), file = $("#st-file");
  if (imp && file) {
    imp.onclick = () => file.click();
    file.onchange = () => { if (file.files && file.files[0]) importData(file.files[0]); file.value = ""; };
  }

  const save = $("#st-save");
  if (save) save.onclick = () => {
    if (!collectSettings(true)) return;
    persist();
    showToast("保存しました");
    render();
  };
  const reset = $("#st-reset");
  if (reset) reset.onclick = () => {
    if (reset.dataset.armed) {
      ["circle_profile","circle_logs","circle_journals","circle_tavs"].forEach((k) => localStorage.removeItem(k));
      profile = null; logs = {}; journals = {}; tavs = []; tab = "habit"; overlay = null;
      render();
    } else {
      reset.dataset.armed = "1";
      reset.textContent = "本当にすべて削除する";
      reset.className = "btn-danger";
    }
  };
}

render();
</script>
</body>
</html>
