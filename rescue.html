<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily Circle — 記録の取り出し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#F7F4EE;color:#191C22;min-height:100vh;
  font-family:'Zen Kaku Gothic New',-apple-system,sans-serif;
  padding:28px 20px calc(40px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:520px;margin:0 auto}
.mark{width:48px;height:48px;margin-bottom:14px}
h1{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:20px;letter-spacing:.08em;margin-bottom:6px}
.sub{font-size:12px;color:#4A4E58;letter-spacing:.06em;margin-bottom:22px}
.card{background:#fff;border:1px solid rgba(25,28,34,.14);border-radius:2px;padding:22px 18px;position:relative;margin-bottom:16px}
.card::before{content:"";position:absolute;top:-1px;left:18px;width:40px;height:3px;background:#28407A}
.card.ok::before{background:#B08A3E}
.card.ng::before{background:#7A2828}
h2{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:15px;letter-spacing:.08em;margin-bottom:10px}
p{font-size:13px;line-height:1.95;color:#4A4E58}
p.b{color:#191C22}
.stat{display:flex;gap:1px;background:rgba(25,28,34,.1);border-radius:2px;overflow:hidden;margin:14px 0}
.stat div{flex:1;background:#191C22;padding:12px 4px;text-align:center}
.stat b{display:block;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:19px;color:#AEC0E8;line-height:1.1}
.stat span{display:block;font-size:9.5px;color:rgba(247,244,238,.65);margin-top:4px;letter-spacing:.06em}
button{
  width:100%;border:none;border-radius:999px;padding:15px;font-family:inherit;
  font-size:14.5px;font-weight:700;letter-spacing:.12em;cursor:pointer;margin-top:12px;
  touch-action:manipulation;-webkit-appearance:none;
}
.primary{background:#28407A;color:#F7F4EE}
.ghost{background:transparent;border:1px solid rgba(25,28,34,.2);color:#4A4E58;font-size:13px;letter-spacing:.06em}
textarea{
  width:100%;min-height:160px;margin-top:12px;padding:11px;font-size:11px;line-height:1.6;
  border:1px solid rgba(25,28,34,.2);border-radius:2px;background:#FDFCF9;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#191C22;
}
ol{margin:10px 0 0 18px;font-size:13px;line-height:2.1;color:#191C22}
.note{font-size:11.5px;color:#4A4E58;line-height:1.9;margin-top:10px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1B2C58;color:#F7F4EE;padding:11px 20px;border-radius:999px;
  font-size:12.5px;letter-spacing:.06em;z-index:50;pointer-events:none;
  box-shadow:0 8px 24px rgba(27,44,88,.3);
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.5" stroke="#28407A" stroke-width="2.4" stroke-dasharray="66 13" stroke-linecap="round" transform="rotate(-90 16 16)"/><circle cx="16" cy="3.5" r="2.6" fill="#28407A"/></svg>
  </div>
  <h1>記録の取り出し</h1>
  <div class="sub">Daily Circle — データ移行用ページ</div>
  <div id="out"></div>
</div>

<script>
function $(s){return document.querySelector(s)}
function toast(m){
  var t=document.createElement("div");t.className="toast";t.textContent=m;
  document.body.appendChild(t);setTimeout(function(){t.remove()},2600);
}
function g(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}

var profile=g("circle_profile",null),
    logs=g("circle_logs",{}),
    journals=g("circle_journals",{}),
    tavs=g("circle_tavs",[]);

var payload={app:"daily-circle",version:1,exportedAt:new Date().toISOString(),
             profile:profile||{},logs:logs,journals:journals,tavs:tavs};
var json=JSON.stringify(payload,null,2);

var recDays=Object.keys(logs).length;
var jrDays=Object.keys(journals).length;
var tavN=(tavs||[]).length;
var hasData=!!(profile&&profile.name)||recDays>0;

var out=$("#out");

if(!hasData){
  out.innerHTML=
   '<div class="card ng"><h2>記録が見つかりません</h2>'+
   '<p class="b">このブラウザには Daily Circle の記録が保存されていません。</p>'+
   '<p class="note">考えられる原因：<br>'+
   '・記録していた端末やブラウザが別（例：普段はSafari、いまChromeで開いている）<br>'+
   '・ブラウザのデータを削除した<br>'+
   '・このページを新しいURL（daily-circle.com）で開いている<br><br>'+
   '<strong>記録していた端末で、記録していたブラウザから</strong>このページを開き直してください。</p></div>';
}else{
  out.innerHTML=
   '<div class="card ok"><h2>記録が見つかりました</h2>'+
   '<p>'+(profile&&profile.name?profile.name+' さんの記録です。':'')+'</p>'+
   '<div class="stat">'+
     '<div><b>'+recDays+'</b><span>習慣の記録</span></div>'+
     '<div><b>'+jrDays+'</b><span>ジャーナル</span></div>'+
     '<div><b>'+tavN+'</b><span>TAV</span></div>'+
   '</div>'+
   '<button class="primary" id="dl">ファイルに保存する</button>'+
   '<button class="ghost" id="cp">コピーする（保存できないとき）</button>'+
   '<button class="ghost" id="sh">共有する（LINE・メールなど）</button>'+
   '<p class="note">「ファイルに保存」が選べない場合は「コピーする」を押し、'+
   'メモアプリなどに貼り付けて保管してください。</p>'+
   '</div>'+
   '<div class="card"><h2>このあとの手順</h2><ol>'+
   '<li>上のボタンで記録を保存する</li>'+
   '<li><strong>daily-circle.com</strong> を開く</li>'+
   '<li>メールアドレスでログインする</li>'+
   '<li>仮の内容で登録を済ませる</li>'+
   '<li>メニュー → 設定 →「書き出したファイルから復元する」</li>'+
   '<li>保存したファイルを選ぶ</li>'+
   '</ol>'+
   '<p class="note">コピーで保管した場合は、貼り付けた内容を '+
   '<strong>backup.json</strong> という名前のファイルにしてから復元してください。</p></div>'+
   '<div class="card"><h2>記録の中身（確認用）</h2>'+
   '<textarea id="ta" readonly></textarea></div>';

  $("#ta").value=json;

  $("#dl").onclick=function(){
    try{
      var b=new Blob([json],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      var d=new Date();
      a.download="daily-circle-backup-"+d.getFullYear()+"-"+
        String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
      toast("保存しました");
    }catch(e){ toast("保存できません。コピーをお使いください"); }
  };

  $("#cp").onclick=function(){
    var ta=$("#ta");
    ta.removeAttribute("readonly");
    ta.select(); ta.setSelectionRange(0,999999);
    var ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){}
    ta.setAttribute("readonly","");
    if(navigator.clipboard&&!ok){
      navigator.clipboard.writeText(json).then(function(){toast("コピーしました")},
        function(){toast("下の枠を長押しして全選択→コピーしてください")});
    }else{
      toast(ok?"コピーしました":"下の枠を長押しして全選択→コピーしてください");
    }
  };

  $("#sh").onclick=function(){
    if(navigator.share){
      try{
        var f=new File([json],"daily-circle-backup.json",{type:"application/json"});
        if(navigator.canShare&&navigator.canShare({files:[f]})){
          navigator.share({files:[f],title:"Daily Circle 記録"});
          return;
        }
      }catch(e){}
      navigator.share({title:"Daily Circle 記録",text:json}).catch(function(){});
    }else{
      toast("この端末では共有が使えません");
    }
  };
}
</script>
</body>
</html>
