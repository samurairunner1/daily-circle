/* ---------- settings helper ---------- */
function collectSettings(validate) {
  const goals = [...document.querySelectorAll(".st-goal")].map((e) => e.value.trim()).filter(Boolean);
  const named = [...document.querySelectorAll(".st-habit")].map((e) => ({ id: e.dataset.hid, name: e.value.trim() }));
  if (validate) {
    if (goals.length === 0) { showToast("目標を1つ以上入力してください"); return false; }

  }
  if (goals.length) profile.goals = goals.slice(0, 3);
  // 空欄の習慣は保存時のみ除外（編集途中は保持）
  profile.habits = validate ? named.filter((h) => h.name) : named;
  return true;
}

/* ---------- backup ---------- */
function exportData() {
  const payload = {
    app: "daily-circle", version: 1, exportedAt: new Date().toISOString(),
    profile, logs, journals, tavs,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "daily-circle-backup-" + todayKey() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast("記録を書き出しました");
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let d;
    try { d = JSON.parse(reader.result); } catch (e) { showToast("ファイルを読み込めませんでした"); return; }
    if (!d || d.app !== "daily-circle" || !d.profile) { showToast("Daily Circleのバックアップではありません"); return; }
    const days = Object.keys(d.logs || {}).length;
    openModal({
      title: "この内容で復元しますか？",
      body: '<p class="card-sub">' + esc(d.profile.name || "") + ' さんの記録（習慣 ' + days + '日ぶん・ジャーナル ' +
        Object.keys(d.journals || {}).length + '件・TAV ' + (d.tavs || []).length + '件）<br><br>' +
        '<strong>現在この端末にある記録は上書きされます。</strong></p>',
      okLabel: "復元する",
      danger: true,
      onOk: () => {
        profile = normalizeProfile(d.profile);
        logs = d.logs || {};
        journals = d.journals || {};
        tavs = d.tavs || [];
        persist();
        overlay = null; tab = "habit"; ringAnimated = false;
        render();
        showToast("記録を復元しました");
      },
    });
  };
  reader.readAsText(file);
}

function normalizeProfile(p) {
  if (!p) return p;
  const goals = p.goals || (p.goal ? [p.goal] : []);
  const habits = (p.habits || p.actions || []).map((h, i) =>
    typeof h === "string" ? { id: "a" + i, name: h } : h);
  return Object.assign({}, p, { goals, habits });
}

function tabsView() {
  const k = todayKey();
  const habitDot = hasHabits()
    ? (!(logs[k] && logs[k].posted) || !(journals[k] && journals[k].savedAt))
    : !(journals[k] && journals[k].savedAt);
  const tavCount = tavs.filter((t) => {
    const s = tavStatus(t);
    return s === "over" || (s === "plan" && t.due === k);
  }).length;

  const items = [
    ["habit", hasHabits() ? "習慣" : "ジャーナル", habitDot ? "dot" : "", ""],
    ["tav", "TAV", "", tavCount ? String(tavCount) : ""],
    ["review", "振り返り", "", ""],
  ];
  return '<nav class="tabs">' + items.map(([key, label, dot, badge]) =>
    '<button class="tab' + (tab === key ? " on" : "") + '" data-tab="' + key + '">' + label +
    (badge ? '<span class="tab-badge">' + badge + '</span>' : (dot ? '<span class="tab-dot"></span>' : '')) +
    '</button>'
  ).join("") + '</nav>';
}

function bindLogin() {
  const msg = $("#lg-msg");

  // --- メール入力ステップ ---
  const send = $("#lg-send"), email = $("#lg-email");
  if (send && email) {
    const doSend = async () => {
      const v = (email.value || "").trim();
      if (!v || v.indexOf("@") < 0) { msg.textContent = "メールアドレスを入力してください"; return; }
      send.disabled = true; msg.textContent = "送信中…";
      const r = await sendMagicLink(v);
      if (r.ok) {
        loginEmail = v; loginStep = "code";
        render();
      } else { msg.textContent = r.msg; send.disabled = false; }
    };
    send.onclick = doSend;
    email.onkeydown = (e) => { if (e.key === "Enter") doSend(); };
  }

  // --- コード入力ステップ ---
  const vf = $("#lg-verify"), code = $("#lg-code");
  if (vf && code) {
    let autoTimer = null;
    const doVerify = async () => {
      clearTimeout(autoTimer);
      const v = (code.value || "").replace(/\D/g, "");
      if (v.length < 6) { msg.textContent = "メールに記載のコードを入力してください"; return; }
      vf.disabled = true; msg.textContent = "確認しています…";
      const r = await verifyCode(v);
      if (!r.ok) { msg.textContent = r.msg; vf.disabled = false; code.value = ""; }
      // 成功時は onAuthStateChange が render を呼ぶ
    };
    vf.onclick = doVerify;
    code.oninput = () => {
      code.value = code.value.replace(/\D/g, "").slice(0, 10);
      clearTimeout(autoTimer);
      // 入力が止まって0.6秒後に自動送信（桁数が6/8どちらでも対応）
      if (code.value.length >= 6) autoTimer = setTimeout(doVerify, 600);
    };
    code.onkeydown = (e) => { if (e.key === "Enter") doVerify(); };
    setTimeout(() => { try { code.focus(); } catch (e) {} }, 100);
  }

  const paste = $("#lg-paste");
  if (paste && code) paste.onclick = async () => {
    try {
      const t = await navigator.clipboard.readText();
      const n = (t || "").replace(/\D/g, "").slice(0, 10);
      if (!n) { msg.textContent = "コピーした内容に数字が見つかりませんでした"; return; }
      code.value = n;
      code.dispatchEvent(new Event("input", { bubbles: true }));
    } catch (e) {
      msg.textContent = "貼り付けできませんでした。手入力してください。";
    }
  };

  const back = $("#lg-back");
  if (back) back.onclick = () => { loginStep = "email"; render(); };

}

/* ---------- render & bind ---------- */
function render() {
  const app = $("#app");
  // 同期が有効かつ未ログイン、かつ「この端末だけ」を選んでいない場合はログイン画面
  if (cloudEnabled() && !cloudReady && !localOnly) {
    app.innerHTML = '<div class="onb"><div class="onb-mark">' + RING + '</div>' +
      '<p class="onb-lead" style="margin-top:18px">読み込んでいます…</p></div>';
    return;
  }
  if (cloudEnabled() && !signedIn() && !localOnly) {
    app.innerHTML = loginView();
    bindLogin();
    return;
  }
  if (!profile) { app.innerHTML = onbView(); bindOnb(); return; }
  const stats = computeStats();
  if (overlay) {
    app.innerHTML = overlayView(stats);
    bindApp();
    return;
  }
  let body = "";
  if (tab === "habit") body = habitView();
  else if (tab === "tav") body = tavView();
  else body = recordView(stats);
  app.innerHTML = headerView(stats) + body + tabsView();
  bindApp();
}

function bindOnb() {
  $("#ob-add-goal").onclick = () => {
    const box = $("#ob-goals");
    if (box.children.length >= 3) return;
    const t = document.createElement("textarea");
    t.className = "fld"; t.placeholder = "目標 " + (box.children.length + 1);
    box.appendChild(t);
    if (box.children.length >= 3) $("#ob-add-goal").style.display = "none";
  };
  $("#ob-add-habit").onclick = () => {
    const box = $("#ob-habits");
    if (box.children.length >= 5) return;
    const t = document.createElement("input");
    t.className = "fld"; t.placeholder = "習慣 " + (box.children.length + 1);
    box.appendChild(t);
    if (box.children.length >= 5) $("#ob-add-habit").style.display = "none";
  };
  $("#ob-start").onclick = () => {
    const name = $("#ob-name").value.trim();
    const goals = [...$("#ob-goals").children].map((e) => e.value.trim()).filter(Boolean);
    const habits = [...$("#ob-habits").children].map((e) => e.value.trim()).filter(Boolean);
    if (!name) { showToast("名前を入力してください"); return; }
    if (goals.length === 0) { showToast("目標を1つ以上入力してください"); return; }

    profile = {
      name, goals, group: (profile && profile.group) || "",
      habits: habits.slice(0, 5).map((n, i) => ({ id: "a" + i, name: n })),
      startDate: todayKey(),
    };
    applyFetchedGroup();
    persist();
    render();
    fetchGroup().then(() => render());
  };
}

function bindApp() {
  try {
  document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; menuOpen = false; ringAnimated = false; dayOffset = 0; monthOffset = 1; monthlyReport = null; render(); }));

  // header menu

  if (mb) mb.onclick = (e) => { e.stopPropagation(); menuOpen = !menuOpen; render(); };

    overlay = b.dataset.open; menuOpen = false; ringAnimated = false; render();
  }));
  const mbd = $("#menu-backdrop");
  if (mbd) mbd.onclick = () => { menuOpen = false; render(); };
  const ovc = $("#ov-close");
  if (ovc) ovc.onclick = () => { overlay = null; ringAnimated = false; render(); };

  // journal
  const js = $("#jr-save");
  if (js) js.onclick = saveJournal;
  const fbr = $("#fb-retry");
  if (fbr) fbr.onclick = () => runFeedback(targetKey());
  document.querySelectorAll("[data-weather]").forEach((box) => {
    box.querySelectorAll(".w-opt").forEach((b) => (b.onclick = () => {
      const v = b.dataset.w;
      const next = box.dataset.val === v ? "" : v;   // 同じものを再タップで解除
      box.dataset.val = next;
      box.querySelectorAll(".w-opt").forEach((x) => x.classList.toggle("on", x.dataset.w === next));
    }));
  });
  const starBox = $("#jr-stars");
  if (starBox) {
    const paint = (v) => {
      starBox.dataset.val = v;
      starBox.querySelectorAll(".star").forEach((s) =>
        s.classList.toggle("on", Number(s.dataset.star) <= v));
      const cl = $("#jr-star-clear");
      if (cl) cl.textContent = v ? "クリア" : "";
    };
    starBox.querySelectorAll(".star").forEach((s) =>
      (s.onclick = () => paint(Number(s.dataset.star))));
    const cl = $("#jr-star-clear");
    if (cl) cl.onclick = () => paint(0);
  }

  // TAV
  const ta = $("#tav-add");
  if (ta) ta.onclick = addTav;
  const tb = $("#tav-bulk-add");
  if (tb) tb.onclick = addTavBulk;
  const tModeB = $("#tav-mode-bulk");
  if (tModeB) tModeB.onclick = () => { tavBulk = true; render(); };
  const tModeO = $("#tav-mode-one");
  if (tModeO) tModeO.onclick = () => { tavBulk = false; render(); };
  document.querySelectorAll("[data-tav-toggle]").forEach((b) => (b.onclick = () => {
    const id = b.dataset.tavToggle;
    tavOpen[id] = !tavOpen[id];
    render();
  }));
  const tqc = $("#tav-q-clear");
  if (tqc) tqc.onclick = () => { tavQuery = ""; render(); };
  const tq = $("#tav-q");
  if (tq) {
    tq.oninput = () => {
      const pos = tq.selectionStart;
      tavQuery = tq.value;
      clearTimeout(window.__tavQT);
      window.__tavQT = setTimeout(() => {
        render();
        const el = $("#tav-q");
        if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
      }, 250);
    };
  }
  document.querySelectorAll("[data-tavfilter]").forEach((b) => (b.onclick = () => { tavFilter = b.dataset.tavfilter; render(); }));
  document.querySelectorAll("[data-tav-do]").forEach((b) => (b.onclick = () => tavSetDue(b.dataset.tavDo)));
  document.querySelectorAll("[data-tav-done]").forEach((b) => (b.onclick = () => tavComplete(b.dataset.tavDone)));
  document.querySelectorAll("[data-tav-skip]").forEach((b) => (b.onclick = () => tavSkip(b.dataset.tavSkip)));
  document.querySelectorAll("[data-tav-share]").forEach((b) => (b.onclick = () => tavShare(b.dataset.tavShare)));
  document.querySelectorAll("[data-tav-revive]").forEach((b) => (b.onclick = () => tavRevive(b.dataset.tavRevive)));
  document.querySelectorAll("[data-tav-del]").forEach((b) => (b.onclick = () => tavDelete(b.dataset.tavDel)));

  document.querySelectorAll(".action-row").forEach((b) => (b.onclick = () => toggleHabit(b.dataset.habit)));
  const post = $("#post-today");
  if (post) post.onclick = postToday;
  if ($("#mini-ring")) animateMiniRing();
  const goDay = (n) => {
    dayOffset = Math.max(0, Math.min(maxBack(), n));
    ringAnimated = false; render();
  };
  const dp = $("#day-prev"); if (dp) dp.onclick = () => goDay(dayOffset + 1);
  const dn = $("#day-next"); if (dn) dn.onclick = () => goDay(dayOffset - 1);
  const dt = $("#day-today"); if (dt) dt.onclick = () => goDay(0);
  const pick = $("#day-pick");
  if (pick) pick.onchange = () => {
    if (!pick.value) return;
    goDay(daysBetween(dateFromKey(pick.value), dateFromKey(todayKey())));
  };
  document.querySelectorAll("[data-goto]").forEach((b) => (b.onclick = () => { tab = b.dataset.goto; ringAnimated = false; render(); }));
  const msSel = $("#ms-month");
  if (msSel) msSel.onchange = () => {
    monthOffset = Number(msSel.value) || 0;
    monthlyReport = null;          // 月を変えたら作り直し
    render();
  };
  const msg2 = $("#ms-gen") || $("#ms-regen");
  if (msg2) msg2.onclick = runMonthly;
  const dl = $("#dl-card");
  if (dl) dl.onclick = generateCard;
  } catch (e) { console.error("bindApp:", e); }

  const addGoal = $("#st-add-goal");
  if (addGoal) addGoal.onclick = () => {
    const box = $("#st-goals");
    if (box.children.length >= 3) return;
    const t = document.createElement("textarea");
    t.className = "fld st-goal"; t.placeholder = "目標 " + (box.children.length + 1);
    box.appendChild(t);
    if (box.children.length >= 3) addGoal.style.display = "none";
  };
  const addHabit = $("#st-add-habit");
  if (addHabit) addHabit.onclick = () => {
    if (profile.habits.length >= 5) return;
    collectSettings();
    profile.habits.push({ id: uid(), name: "" });
    persist(); render();
  };
  document.querySelectorAll("[data-mv]").forEach((b) => (b.onclick = () => {
    collectSettings();
    const i = Number(b.dataset.i), j = b.dataset.mv === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= profile.habits.length) return;
    const t = profile.habits[i]; profile.habits[i] = profile.habits[j]; profile.habits[j] = t;
    persist(); render();
  }));
  document.querySelectorAll("[data-hdel]").forEach((b) => (b.onclick = () => {
    const id = b.dataset.hdel;
    const h = profile.habits.find((x) => x.id === id);
    openModal({
      title: "この習慣を削除しますか？",
      body: '<p class="card-sub">「' + esc(h ? h.name : "") + '」を一覧から外します。過去の記録は残りますが、今後の記録対象ではなくなります。</p>',
      okLabel: "削除する", danger: true,
      onOk: () => {
        collectSettings();
        profile.habits = profile.habits.filter((x) => x.id !== id);
        persist(); render(); showToast("習慣を削除しました");
      },
    });
  }));

  const sy = $("#st-sync");
  if (sy) sy.onclick = async () => {
    sy.disabled = true; sy.textContent = "同期しています…";
    await pullAndMerge();
    showToast(syncState === "error" ? "同期に失敗しました" : "同期しました");
  };
  const dr = $("#demo-reset");
  if (dr) dr.onclick = () => {
    menuOpen = false;
    openModal({
      title: "サンプルに戻しますか",
      body: '<p class="card-sub">デモ中に入力した内容は消え、最初のサンプルデータに戻ります。</p>',
      okLabel: "戻す",
      onOk: () => {
        loadDemoSeed(true);
        profile = load("demo_profile");
        logs = load("demo_logs") || {};
        journals = load("demo_journals") || {};
        tavs = load("demo_tavs") || [];
        monthlyReport = null; dayOffset = 0; monthOffset = 1; tab = "habit";
        render();
        showToast("サンプルに戻しました");
      },
    });
  };
  const so = $("#st-signout");
  if (so) so.onclick = signOutCloud;
  const si = $("#st-signin");
  if (si) si.onclick = () => {
    localOnly = false;
    localStorage.removeItem("demo_local_only");
    overlay = null;
    render();
  };

  const exp = $("#st-export");
  if (exp) exp.onclick = exportData;
  const imp = $("#st-import"), file = $("#st-file");
  if (imp && file) {
    imp.onclick = () => file.click();
    file.onchange = () => { if (file.files && file.files[0]) importData(file.files[0]); file.value = ""; };
  }

  const save = $("#st-save");
  if (save) save.onclick = () => {
    if (!collectSettings(true)) return;
    persist();
    showToast("保存しました");
    render();
  };
  const reset = $("#st-reset");
  if (reset) reset.onclick = () => {
    if (reset.dataset.armed) {
      ["demo_profile","demo_logs","demo_journals","demo_tavs"].forEach((k) => localStorage.removeItem(k));
      profile = null; logs = {}; journals = {}; tavs = []; tab = "habit"; overlay = null;
      render();
    } else {
      reset.dataset.armed = "1";
      reset.textContent = "本当にすべて削除する";
      reset.className = "btn-danger";
    }
  };
}

render();
initCloud().then(() => render());
</script>
</body>
</html>
