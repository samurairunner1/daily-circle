<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily Circle — 日々の記録帳</title>
<meta name="description" content="Daily Circle — Circleの一年目標を、毎日の習慣でつなぐ記録帳。">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F7F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Circle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* ===== iOS Safari 対策 ===== */
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:rgba(40,64,122,.12)}
button,input,textarea,select{
  -webkit-appearance:none;appearance:none;
  touch-action:manipulation;          /* ダブルタップズーム遅延を除去 */
  font-size:16px;                     /* 16px未満だとiOSが自動ズームする */
}
button{touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
button svg{pointer-events:none}       /* SVGがタップ判定を奪わないように */
.w-opt span,.action-name,.tab{pointer-events:none}
.tab{pointer-events:auto}
input[type="checkbox"]{-webkit-appearance:checkbox;appearance:checkbox}

/* メニュー背面（外側タップで閉じる） */
.menu-backdrop{position:fixed;inset:0;z-index:55;background:transparent}


body{
  min-height:100vh;background:#F7F4EE;color:#191C22;
  font-family:'Zen Kaku Gothic New',-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.center-msg{padding:80px 20px;text-align:center;color:#4A4E58;letter-spacing:.12em}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px}
.brand{display:flex;gap:11px;align-items:center}
.brand-mark{width:34px;height:34px;flex-shrink:0;display:block}
.brand-mark svg{width:100%;height:100%;display:block}
.brand-name{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:18px;letter-spacing:.14em}
.brand-sub{font-size:11px;color:#4A4E58;margin-top:1px;letter-spacing:.05em}
.streak-pill{background:#191C22;color:#F7F4EE;border-radius:999px;padding:7px 15px;display:flex;align-items:baseline;gap:4px}
.streak-num{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:18px;color:#AEC0E8;line-height:1}
.streak-label{font-size:10px;opacity:.72;letter-spacing:.1em}

/* body */
.body{padding:12px 20px 24px;display:flex;flex-direction:column;gap:18px}
.date-row{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.date-big{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:30px;letter-spacing:.08em}
.date-wd{color:#4A4E58;font-size:13px;letter-spacing:.1em}
.goals-box{display:flex;flex-direction:column;gap:8px}
.goal-line{font-size:13px;color:#4A4E58;border-left:2px solid #28407A;padding-left:10px;line-height:1.9}

.card{background:#fff;border:1px solid rgba(25,28,34,.14);border-radius:2px;padding:26px 22px 22px;position:relative}
.card::before{content:"";position:absolute;top:-1px;left:22px;width:44px;height:3px;background:#28407A}
.card.danger::before{background:#4A4E58}
.card-title{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:16.5px;letter-spacing:.08em;margin-bottom:8px}
.card-sub{font-size:12.5px;color:#4A4E58;margin-bottom:12px;line-height:1.9}

/* habits */
.action-row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:transparent;border:none;border-bottom:1px solid rgba(25,28,34,.1);
  padding:12px 2px;cursor:pointer;font-family:inherit;color:inherit;font-size:15px;
}
.action-row:last-of-type{border-bottom:none}
.stamp{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  border:1.5px solid rgba(40,64,122,.35);display:flex;align-items:center;justify-content:center;
  font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:16px;color:transparent;
  transition:all .25s cubic-bezier(.22,1,.36,1);
}
.stamp.pressed{border-color:#28407A;color:#F7F4EE;background:#28407A;box-shadow:0 4px 12px rgba(27,44,88,.24)}
.action-row.done .action-name{color:#4A4E58}
.action-name{font-weight:500;letter-spacing:.02em}
.all-done{margin-top:12px;font-family:'Shippori Mincho B1',serif;color:#28407A;font-size:13.5px;text-align:center;letter-spacing:.08em}

/* fields & buttons */
.fld{
  width:100%;border:1px solid rgba(25,28,34,.18);background:#fff;border-radius:2px;
  padding:12px 13px;font-size:15px;font-family:inherit;color:#191C22;margin-bottom:10px;
}
.fld:focus{outline:2px solid #28407A;outline-offset:1px;border-color:transparent}
textarea.fld{resize:vertical;min-height:64px;line-height:1.9}
.fld-label{display:block;font-size:12px;font-weight:700;color:#4A4E58;margin-bottom:6px;letter-spacing:.08em;margin-top:6px}
.btn-primary{
  width:100%;background:#28407A;color:#F7F4EE;border:none;border-radius:999px;
  padding:14px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.14em;transition:background .3s;
}
.btn-primary:hover{background:#1B2C58}
.btn-primary:disabled{opacity:.4;cursor:default}
.post-btn{margin-top:16px}
.share-row{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(25,28,34,.14)}
.saved-hint{
  display:flex;align-items:center;gap:7px;
  font-size:11.5px;color:#4A4E58;letter-spacing:.03em;margin-bottom:10px;
}
.share-row .post-btn{margin-top:0}
.post-opt{
  font-size:9.5px;font-weight:500;letter-spacing:.1em;margin-left:8px;
  border:1px solid rgba(247,244,238,.45);border-radius:999px;padding:2px 7px;
  vertical-align:1px;font-family:'Zen Kaku Gothic New',sans-serif;
}
.btn-primary:disabled .post-opt{border-color:rgba(247,244,238,.3)}
.share-note{font-size:11px;color:#4A4E58;line-height:1.8;margin-top:8px;text-align:center}
.saved-dot{width:7px;height:7px;border-radius:50%;background:#28407A;flex-shrink:0}
.share-card::before{background:#B08A3E}
.btn-ghost{
  background:transparent;border:1px solid rgba(25,28,34,.18);border-radius:999px;padding:10px;
  font-family:inherit;font-size:13px;color:#4A4E58;cursor:pointer;width:100%;margin-bottom:10px;letter-spacing:.06em;
}
.btn-danger{width:100%;background:#7A2828;color:#fff;border:none;border-radius:999px;padding:12px;font-family:inherit;font-weight:700;cursor:pointer;letter-spacing:.1em}
.note{font-size:11.5px;color:#4A4E58;margin-top:10px;line-height:1.9}

/* stats */

/* year grid */
.year-grid{display:flex;flex-direction:column;gap:5px}
.month-row{display:flex;align-items:center;gap:8px}
.month-label{width:32px;font-size:10px;color:#4A4E58;font-family:'Shippori Mincho B1',serif;flex-shrink:0;text-align:right;letter-spacing:.04em}
.day-cells{display:flex;gap:2px;flex-wrap:wrap}
.cell{width:8px;height:8px;border-radius:50%;display:inline-block}
.glegend{display:flex;gap:16px;font-size:11px;color:#4A4E58;margin-top:14px;justify-content:center;letter-spacing:.06em;flex-wrap:wrap}
.gd{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.gd-full{background:#28407A}
.gd-part{background:transparent;border:1.5px solid #28407A}
.gd-none{background:#EDEAE1}

/* habit rows */
.habit-row{padding:12px 0;border-bottom:1px solid rgba(25,28,34,.08)}
.habit-row:last-child{border-bottom:none}
.habit-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.habit-name{font-size:14px;font-weight:700;letter-spacing:.02em}
.habit-meta{font-size:11px;color:#4A4E58;white-space:nowrap}
.habit-meta em{font-style:normal;color:#B08A3E;font-weight:700}
.habit-meta b{font-weight:700;color:#28407A}
.habit-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.hd{width:9px;height:9px;border-radius:50%;background:#EDEAE1;display:inline-block}
.hd.on{background:#28407A}

/* onboarding */
.onb{padding:52px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.onb-mark{width:56px;height:56px;margin-bottom:18px}
.onb-mark svg{width:100%;height:100%;display:block}
.onb-title{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:23px;letter-spacing:.16em;margin-bottom:6px}
.onb-tate{font-size:11px;letter-spacing:.4em;color:#28407A;font-weight:500;margin-bottom:16px}
.onb-lead{font-size:13px;color:#4A4E58;line-height:2.1;max-width:340px;margin-bottom:26px}
.onb-card{
  width:100%;max-width:360px;text-align:left;background:#fff;
  border:1px solid rgba(25,28,34,.14);border-radius:2px;padding:24px 20px;position:relative;
}
.onb-card::before{content:"";position:absolute;top:-1px;left:20px;width:44px;height:3px;background:#28407A}

/* tabs */
.tabs{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;display:flex;background:rgba(247,244,238,.96);
  backdrop-filter:blur(4px);
  border-top:1px solid rgba(25,28,34,.14);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:40;
}
.tab{
  flex:1;background:transparent;border:none;font-family:'Shippori Mincho B1',serif;
  font-weight:700;font-size:14px;letter-spacing:.2em;color:#4A4E58;padding:15px 4px;cursor:pointer;min-height:48px;
  position:relative;transition:color .3s;
}
.tab.on{color:#28407A}
.tab.on::after{
  content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:#28407A;
}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:#1B2C58;color:#F7F4EE;padding:10px 20px;border-radius:999px;
  font-size:12.5px;letter-spacing:.06em;box-shadow:0 8px 24px rgba(27,44,88,.28);z-index:50;white-space:nowrap;pointer-events:none;
  max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}

/* v2: day head + mini ring */
.day-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:8px 0 2px}
.day-sub{font-size:11.5px;color:#4A4E58;letter-spacing:.04em;margin-top:5px}
.mini-ring{position:relative;width:66px;height:66px;flex-shrink:0}
.mini-ring svg{width:100%;height:100%;display:block}
.mini-ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.mini-ring-txt small{font-size:10px;font-weight:500;color:#4A4E58;margin-left:1px}
.mini-ring.gold .mini-ring-txt{color:#B08A3E}

/* v2: habit rows with streak */
.action-body{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.action-streak{font-size:10.5px;color:#B08A3E;font-weight:700;letter-spacing:.06em}
.card-done::before{background:#B08A3E}

/* v2: completion panel */
.done-panel{text-align:center}
.done-panel::before{background:#B08A3E}
.done-mark{width:46px;height:46px;border-radius:50%;background:#B08A3E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 12px}
.done-panel .btn-ghost{margin-top:4px}

/* v2: goals fold */
.goals-fold{border-top:1px solid rgba(25,28,34,.12);padding-top:14px}
.goals-fold summary{cursor:pointer;list-style:none;font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:13.5px;letter-spacing:.08em;color:#4A4E58;position:relative;padding-right:20px}
.goals-fold summary::-webkit-details-marker{display:none}
.goals-fold summary::after{content:"";position:absolute;right:4px;top:.36em;width:8px;height:8px;border-right:1.5px solid #28407A;border-bottom:1.5px solid #28407A;transform:rotate(45deg);transition:transform .3s}
.goals-fold[open] summary::after{transform:rotate(-135deg);top:.6em}
.goals-fold .goals-box{margin-top:12px}

/* v2: tab indicators */
.tab{display:flex;align-items:center;justify-content:center;gap:5px}
.tab-dot{width:5px;height:5px;border-radius:50%;background:rgba(40,64,122,.42);display:inline-block}
.tab.on .tab-dot{background:#28407A}
.tab-badge{min-width:17px;height:17px;border-radius:999px;background:#7A2828;color:#fff;font-family:'Zen Kaku Gothic New',sans-serif;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;letter-spacing:0}
.tab.on::after{bottom:4px}

/* v3: journal in habit tab */
.opt-tag{font-size:10px;font-weight:500;letter-spacing:.1em;color:#4A4E58;border:1px solid rgba(25,28,34,.2);border-radius:999px;padding:2px 8px;margin-left:9px;vertical-align:2px;font-family:'Zen Kaku Gothic New',sans-serif}

/* v3: journal review */
.jrv-list{margin-top:20px}
.jrv-month{margin-bottom:18px}
.jrv-month-label{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:13px;letter-spacing:.08em;color:#28407A;padding-bottom:7px;border-bottom:1px solid rgba(25,28,34,.12);display:flex;justify-content:space-between;align-items:baseline}
.jrv-month-label span{font-size:10.5px;color:#4A4E58;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;letter-spacing:.06em}
.jrv{border-bottom:1px solid rgba(25,28,34,.07)}
.jrv summary{cursor:pointer;list-style:none;padding:11px 18px 11px 0;display:flex;gap:11px;align-items:baseline;position:relative}
.jrv summary::-webkit-details-marker{display:none}
.jrv summary::after{content:"";position:absolute;right:3px;top:1.15em;width:7px;height:7px;border-right:1.4px solid rgba(40,64,122,.5);border-bottom:1.4px solid rgba(40,64,122,.5);transform:rotate(45deg);transition:transform .25s}
.jrv[open] summary::after{transform:rotate(-135deg);top:1.35em}
.jrv-date{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:12.5px;color:#B08A3E;flex-shrink:0;min-width:34px}
.jrv-peek{font-size:12px;color:#4A4E58;line-height:1.7;overflow:hidden}
.jrv-body{padding:2px 0 14px}
.jrv-q{font-size:11px;font-weight:700;color:#28407A;letter-spacing:.04em;margin-top:10px}
.jrv-a{font-size:13px;color:#191C22;line-height:2;margin-top:3px;white-space:pre-wrap}

/* v3: journal stars */
.stars{display:flex;align-items:center;gap:5px;margin:2px 0 16px}
.star{width:40px;height:40px;padding:0;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.star svg{width:26px;height:26px;fill:none;stroke:rgba(40,64,122,.35);stroke-width:1.6;transition:all .18s ease}
.star.on svg{fill:#B08A3E;stroke:#B08A3E}
.star:hover svg{stroke:#B08A3E}
.star-clear{font-size:10.5px;color:#4A4E58;margin-left:6px;cursor:pointer;letter-spacing:.06em;text-decoration:underline;text-underline-offset:2px}
.jrv-stars{font-size:11px;color:#B08A3E;letter-spacing:.06em;flex-shrink:0}

/* v3: weather selector (心・体 それぞれフル幅1行) */
.w-line{display:flex;flex-direction:column;gap:6px;margin:2px 0 14px}
.w-unit{display:flex;align-items:center;gap:9px}
.w-label{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:13.5px;letter-spacing:.1em;color:#191C22;width:20px;flex-shrink:0}
.w-opts{display:flex;gap:6px;flex:1}
.w-opt{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 4px;min-height:46px;border:1px solid rgba(25,28,34,.16);border-radius:2px;
  background:#fff;cursor:pointer;transition:all .18s ease;font-family:inherit;
}
.w-opt svg{width:22px;height:22px;flex-shrink:0}
.w-opt span{font-size:11.5px;color:#4A4E58;letter-spacing:.06em}
.w-opt .w-fill{fill:rgba(25,28,34,.2)}
.w-opt .w-stroke{stroke:rgba(25,28,34,.2);stroke-width:2;stroke-linecap:round}
.w-opt.on{border-color:#28407A;background:rgba(40,64,122,.07)}
.w-opt.on .w-fill{fill:#28407A}
.w-opt.on .w-stroke{stroke:#28407A}
.w-opt.on span{color:#28407A;font-weight:700}
.jr-ta{min-height:52px}

/* v3: weather grid */
.wg{margin-top:20px}
.wg-title{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:12.5px;letter-spacing:.1em;color:#28407A;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.wg-title span{font-family:'Zen Kaku Gothic New',sans-serif;font-size:10.5px;font-weight:500;color:#4A4E58;letter-spacing:.04em}

/* v3: weather icon in list */
.jrv-ws{display:inline-flex;gap:3px;flex-shrink:0;align-items:center}
.jrv-w svg{width:15px;height:15px;display:block}
.jrv-w .w-fill{fill:rgba(40,64,122,.62)}
.jrv-w .w-stroke{stroke:rgba(40,64,122,.62);stroke-width:2.2;stroke-linecap:round}

/* v3: TAV review list */
.tvr-list{margin-top:4px}
.tvr{border-bottom:1px solid rgba(25,28,34,.08)}
.tvr:last-child{border-bottom:none}
.tvr summary{cursor:pointer;list-style:none;padding:11px 18px 11px 0;display:flex;gap:11px;align-items:baseline;position:relative}
.tvr summary::-webkit-details-marker{display:none}
.tvr summary::after{content:"";position:absolute;right:3px;top:1.15em;width:7px;height:7px;border-right:1.4px solid rgba(40,64,122,.5);border-bottom:1.4px solid rgba(40,64,122,.5);transform:rotate(45deg);transition:transform .25s}
.tvr[open] summary::after{transform:rotate(-135deg);top:1.35em}
.tvr-date{font-family:'Shippori Mincho B1',serif;font-weight:700;font-size:12px;color:#B08A3E;flex-shrink:0;min-width:32px}
.tvr-title{font-size:13px;font-weight:700;line-height:1.7;color:#191C22}
.tvr-body{padding:2px 0 14px}
.tvr-q{font-size:10px;font-weight:700;letter-spacing:.14em;color:#B08A3E;margin-top:9px}
.tvr-a{font-size:12.5px;color:#191C22;line-height:1.95;margin-top:3px;white-space:pre-wrap}

/* v3: day switch (昨日編集) */
.day-nav{display:flex;gap:6px;align-items:center;margin:4px 0 6px}
.dnav{
  min-width:38px;height:38px;border:1px solid rgba(25,28,34,.16);border-radius:999px;
  background:transparent;font-size:17px;line-height:1;color:#28407A;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;
}
.dnav:disabled{opacity:.28;cursor:default}
.dnav.today-btn{
  width:auto;padding:0 14px;font-family:'Shippori Mincho B1',serif;font-weight:700;
  font-size:12px;letter-spacing:.08em;
}
.day-picker{
  flex:1;min-width:0;height:38px;border:1px solid rgba(25,28,34,.16);border-radius:999px;
  background:#fff;padding:0 12px;font-family:inherit;font-size:13px;color:#191C22;
  text-align:center;-webkit-appearance:none;appearance:none;
}
.yst-tag{font-size:10px;font-weight:700;letter-spacing:.1em;background:#B08A3E;color:#fff;border-radius:999px;padding:3px 9px;margin-left:9px;vertical-align:3px;font-family:'Zen Kaku Gothic New',sans-serif}

/* v3: settings habit rows */
.st-hrow{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.st-hrow .fld{margin-bottom:0;flex:1}
.st-hmove{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.st-mv{width:26px;height:19px;border:1px solid rgba(25,28,34,.16);background:#fff;border-radius:2px;font-size:8px;color:#28407A;cursor:pointer;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
.st-mv:disabled{opacity:.28;cursor:default}

/* journal */

.jr-past-body{font-size:12.5px;color:#4A4E58;line-height:1.9;margin-top:4px}

/* TAV */

}

.tav-gh.g-today{color:#B08A3E;border-color:rgba(176,138,62,.35)}
.tav-gh.g-today span{background:rgba(176,138,62,.14);color:#B08A3E}
.tav-gh.g-week{color:#28407A}

/* カード */
.tav{border:1px solid rgba(25,28,34,.12);border-radius:2px;margin-bottom:7px;background:#fff;overflow:hidden}
.tav.open{border-color:rgba(25,28,34,.2)}

}
.tav-title{flex:1;font-size:13.5px;line-height:1.6;font-weight:700;letter-spacing:.01em;min-width:0}

}

.modal-btns .btn-ghost{margin:0;flex:1}

/* year ring */
.ring-wrap{position:relative;max-width:270px;margin:10px auto 0;width:82%}

<script>

const DAY_SHIFT_MS = 3 * 3600 * 1000; // 深夜3時までは前日としてカウント
const appNow = () => new Date(Date.now() - DAY_SHIFT_MS);
const todayKey = () => keyFromDate(appNow());
function keyFromDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dateFromKey(k) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
}
const daysBetween = (a, b) => Math.floor((b - a) / 86400000);

function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}

function persist() {
  persistLocal();
  try { schedulePush(); } catch (e) {}
}

/* ---------- stats ---------- */
function computeStats() {
  const start = dateFromKey(profile.startDate);
  const now = dateFromKey(todayKey());
  const elapsed = Math.max(1, daysBetween(start, now) + 1);
  const useHabits = hasHabits();
  const nHabits = (profile.habits || []).length || 1;
  let totalDone = 0, stampedDays = 0;
  // 習慣がない人は「ジャーナルを書いた日」を記録日とする
  const marked = (k) => useHabits
    ? !!(logs[k] && (logs[k].done || []).length > 0)
    : !!(journals[k] && journals[k].savedAt);
  if (useHabits) {
    Object.values(logs).forEach((v) => {
      const done = (v.done || []).length;
      totalDone += done;
      if (done > 0) stampedDays++;
    });
  } else {
    Object.keys(journals).forEach((k) => { if (journals[k] && journals[k].savedAt) stampedDays++; });
  }
  let streak = 0;
  const cur = new Date(now);
  for (;;) {
    const key = keyFromDate(cur);
    if (marked(key)) { streak++; cur.setDate(cur.getDate() - 1); }
    else {
      if (key === todayKey()) { cur.setDate(cur.getDate() - 1); continue; }
      break;
    }
  }
  const rate = useHabits
    ? Math.round(totalDone / (nHabits * elapsed) * 100)
    : Math.round(stampedDays / elapsed * 100);
  return { elapsed, rate: Math.min(100, rate), streak, stampedDays, useHabits };
}

function habitBestStreak(habitId) {
  if (!profile || !profile.startDate) return 0;
  const start = dateFromKey(profile.startDate), end = dateFromKey(todayKey());
  let best = 0, run = 0;
  const cur = new Date(start);
  while (cur <= end) {
    const k = keyFromDate(cur);
    if (logs[k] && (logs[k].done || []).includes(habitId)) { run++; if (run > best) best = run; }
    else run = 0;
    cur.setDate(cur.getDate() + 1);
  }
  return best;
}

function computeHabitStats(habitId) {
  const start = dateFromKey(profile.startDate);
  const now = dateFromKey(todayKey());
  const elapsed = Math.max(1, daysBetween(start, now) + 1);
  let doneDays = 0;
  Object.values(logs).forEach((v) => { if ((v.done || []).includes(habitId)) doneDays++; });
  let streak = 0;
  const cur = new Date(now);
  for (;;) {
    const key = keyFromDate(cur);
    if (logs[key] && (logs[key].done || []).includes(habitId)) {
      streak++; cur.setDate(cur.getDate() - 1);
    } else {
      if (key === todayKey()) { cur.setDate(cur.getDate() - 1); continue; }
      break;
    }
  }
  return { streak, rate: Math.min(100, Math.round(doneDays / elapsed * 100)) };
}

/* ---------- monthly record card (⑥) ---------- */
async function generateCard() {
  try { await document.fonts.ready; } catch (e) {}
  const now = appNow();
  const y = now.getFullYear(), mo = now.getMonth();
  const dim = new Date(y, mo + 1, 0).getDate();
  const nHabits = profile.habits.length || 1;

  let recDays = 0, fullDays = 0, best = 0, run = 0;
  const days = [];
  for (let i = 1; i <= dim; i++) {
    const k = y + "-" + String(mo + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
    const v = logs[k];
    const ratio = v ? (v.done || []).length / nHabits : 0;
    const future = dateFromKey(k) > now;
    days.push({ ratio, future });
    if (!future) {
      if (ratio > 0) { recDays++; run++; best = Math.max(best, run); if (ratio >= 1) fullDays++; }
      else run = 0;
    }
  }

  const W = 1080, H = 1080;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const mincho = "'Shippori Mincho B1', serif";
  const gothic = "'Zen Kaku Gothic New', sans-serif";

  x.fillStyle = "#F7F4EE"; x.fillRect(0, 0, W, H);

  // logo ring + wordmark
  x.strokeStyle = "#28407A"; x.lineWidth = 7; x.lineCap = "round";
  x.beginPath(); x.arc(124, 118, 34, -Math.PI / 2 + 0.55, -Math.PI / 2 + 2 * Math.PI - 0.25); x.stroke();
  x.fillStyle = "#28407A"; x.beginPath(); x.arc(124, 84, 8, 0, 2 * Math.PI); x.fill();
  x.fillStyle = "#191C22"; x.textBaseline = "middle";
  x.font = "700 44px " + mincho;
  x.fillText("Daily Circle", 184, 120);

  x.strokeStyle = "rgba(25,28,34,.16)"; x.lineWidth = 2;
  x.beginPath(); x.moveTo(90, 186); x.lineTo(W - 90, 186); x.stroke();

  // title & name
  x.fillStyle = "#191C22"; x.font = "800 88px " + mincho;
  x.fillText(y + "年" + (mo + 1) + "月の記録", 90, 286);
  x.fillStyle = "#4A4E58"; x.font = "500 40px " + gothic;
  x.fillText(profile.name, 90, 372);
  x.fillStyle = "#28407A"; x.fillRect(90, 418, 88, 6);

  // dot grid (7 columns)
  const gx = 118, gy = 500, gapX = 140, gapY = 92, r = 28;
  days.forEach((d, i) => {
    const cx = gx + (i % 7) * gapX, cy = gy + Math.floor(i / 7) * gapY;
    x.setLineDash([]);
    if (d.future) {
      x.strokeStyle = "rgba(25,28,34,.2)"; x.lineWidth = 3; x.setLineDash([6, 8]);
      x.beginPath(); x.arc(cx, cy, r, 0, 2 * Math.PI); x.stroke(); x.setLineDash([]);
    } else if (d.ratio >= 1) {
      x.fillStyle = "#28407A"; x.beginPath(); x.arc(cx, cy, r, 0, 2 * Math.PI); x.fill();
    } else if (d.ratio > 0) {
      x.strokeStyle = "rgba(40,64,122," + (0.4 + d.ratio * 0.5).toFixed(2) + ")"; x.lineWidth = 6;
      x.beginPath(); x.arc(cx, cy, r - 3, 0, 2 * Math.PI); x.stroke();
    } else {
      x.fillStyle = "#EDEAE1"; x.beginPath(); x.arc(cx, cy, r, 0, 2 * Math.PI); x.fill();
    }
  });

  // stats
  x.fillStyle = "#191C22"; x.font = "700 38px " + mincho;
  x.fillText("記録 " + recDays + "日　　すべて達成 " + fullDays + "日　　最長 " + best + "日連続", 90, 962);

  // footer
  x.fillStyle = "#B08A3E"; x.font = "600 24px " + mincho;
  try { x.letterSpacing = "8px"; } catch (e) {}
  x.fillText("DAILY CIRCLE — " + y, 90, 1022);
  try { x.letterSpacing = "0px"; } catch (e) {}

  const a = document.createElement("a");
  a.download = "daily-circle-" + y + "-" + String(mo + 1).padStart(2, "0") + ".png";
  a.href = cv.toDataURL("image/png");
  a.click();
  showToast("記録カードを保存しました");
}


/* ---------- weekly report ---------- */
const WD = ["日","月","火","水","木","金","土"];
function fmtDate(d) { return (d.getMonth() + 1) + "/" + d.getDate() + "（" + WD[d.getDay()] + "）"; }

function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // 月曜起点
  return x;
}

function weeklyReportMsg() {
  if (!hasHabits()) return null;
  const M = mondayOf(appNow());
  const wk = keyFromDate(M);
  if ((profile.lastWeeklyReport || "") === wk) return null;
  const prevM = new Date(M); prevM.setDate(prevM.getDate() - 7);
  if (dateFromKey(profile.startDate) > new Date(M.getTime() - 1)) return null; // 先週より後に開始した人はスキップ
  const dayKeys = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(prevM); d.setDate(d.getDate() + i);
    dayKeys.push(keyFromDate(d));
  }
  let recDays = 0;
  dayKeys.forEach((k) => { if (logs[k] && (logs[k].done || []).length > 0) recDays++; });
  const lines = profile.habits.map((h) => {
    let row = "", n = 0;
    dayKeys.forEach((k) => {
      const on = logs[k] && (logs[k].done || []).includes(h.id);
      row += on ? "◉" : "○";
      if (on) n++;
    });
    return row + "　" + h.name + "　" + Math.round(n / 7 * 100) + "%";
  }).join("\n");
  const s = computeStats();
  return {
    wk,
    text: "*" + fmtDate(dateFromKey(dayKeys[0])) + "〜" + fmtDate(dateFromKey(dayKeys[6])) +
      "　" + profile.name + " の一週間*\n" + lines +
      "\n\n記録した日 " + recDays + "/7　　:fire: " + s.streak + "日連続"
  };
}

/* ---------- actions ---------- */
function toggleHabit(habitId) {
  const key = targetKey();
  const day = logs[key] || { done: [] };
  const wasDone = day.done.includes(habitId);
  day.done = wasDone ? day.done.filter((x) => x !== habitId) : [...day.done, habitId];
  logs[key] = day;
  persist();
  render();
}

function postToday() {
  const key = targetKey();
  const day = logs[key] || { done: [] };
  if (day.done.length === 0) { showToast("まずは今日の習慣にチェックを入れてください"); return; }
  const s = computeStats();
  const lines = profile.habits.map((h) => {
    const done = day.done.includes(h.id);
    const hs = done ? computeHabitStats(h.id) : null;
    return (done ? "◉ " : "○ ") + h.name + (done && hs.streak ? "　" + hs.streak + "日" : "");
  }).join("\n");
  const isUpdate = !!day.posted;
  const celebrated = profile.celebrated || [];
  const milestone = (MILESTONES.includes(s.streak) && !celebrated.includes(s.streak)) ? s.streak : null;
  const dd = dateFromKey(key);
  const msg = "*" + fmtDate(dd) + "　" + profile.name + "*" +
    (isPast() ? "（後から記録）" : "") + (isUpdate ? "（更新）" : "") + "\n" +
    lines +
    "\n\n:fire: " + s.streak + "日連続　　達成率 " + s.rate + "%" +
    (milestone ? "\n\n:tada: 祝・" + milestone + "日連続達成" : "");
  sendSlack(msg).then((ok) => {
    if (ok) {
      day.posted = true;
      logs[key] = day;
      if (milestone) profile.celebrated = [...celebrated, milestone];
      persist();
      render();
      if (milestone) showCelebration(milestone);
      showToast(isUpdate ? "Slackに再投稿しました" : "Slackに投稿しました");
      const wr = isPast() ? null : weeklyReportMsg();   // 週次は今日の投稿時のみ
      if (wr) {
        sendSlack(wr.text).then((ok2) => {
          if (ok2) {
            profile.lastWeeklyReport = wr.wk;
            persist();
            showToast("先週のふりかえりも投稿しました");
          }
        });
      }
    } else {
      showToast("投稿に失敗しました。通信環境を確認してください");
    }
  });
}

/* ---------- ジャーナルへのフィードバック ---------- */
let fbLoading = false;

async function runFeedback(key) {
  const entry = journals[key];
  if (!entry) return;   // デモはログイン不要
  const body = JOURNAL_QUESTIONS.map((q) => entry[q.id] ? q.label + "\n" + entry[q.id] : "")
    .filter(Boolean).join("\n\n");
  if (!body.trim()) return;
  const wOf = (id) => { const w = WEATHER.find((x) => x.id === id); return w ? w.label : ""; };
  const ctx = (entry.mind || entry.body)
    ? "（心の調子：" + (wOf(entry.mind) || "—") + "／体の調子：" + (wOf(entry.body) || "—") + "）\n\n" : "";

  fbLoading = true; render();
  try {
    const r = await callAI("feedback", ctx + body);
    entry.feedback = { prelude: r.prelude || "", question: r.question || "", at: Date.now() };
    journals[key] = entry;
    persist();
  } catch (e) {
    console.error("feedback", e);
    entry.feedback = { error: String(e.message || e), at: Date.now() };
    journals[key] = entry;
  }
  fbLoading = false;
  render();
}

function feedbackHTML(fb) {
  if (!fb) return "";
  if (fb.error) {
    return '<div class="fb fb-err"><div class="fb-head"><span class="fb-mark">◇</span>' +
      '<span class="fb-label">問い返し</span></div>' +
      '<p class="fb-prelude">いまは受け取れませんでした。<br>' + esc(fb.error) + '</p>' +
      '<button class="btn-ghost sm" id="fb-retry">もう一度ためす</button></div>';
  }
  return '<div class="fb">' +
    '<div class="fb-head"><span class="fb-mark">◇</span><span class="fb-label">今日の問い返し</span>' +
    '<span class="fb-private">自分だけに表示</span></div>' +
    (fb.prelude ? '<p class="fb-prelude">' + esc(fb.prelude) + '</p>' : '') +
    '<p class="fb-q">' + esc(fb.question) + '</p></div>';
}

/* ---------- journal actions ---------- */
function saveJournal() {
  const key = targetKey();
  const entry = journals[key] || {};
  let any = false;
  document.querySelectorAll(".jr-field").forEach((el) => {
    entry[el.dataset.q] = el.value.trim();
    if (el.value.trim()) any = true;
  });
  if (!any) { showToast("ひとつでも書いてから保存してください"); return; }
  document.querySelectorAll("[data-weather]").forEach((el) => {
    entry[el.dataset.weather] = el.dataset.val || "";
    if (el.dataset.val) any = true;
  });
  const starBox = $("#jr-stars");
  entry.stars = starBox ? Number(starBox.dataset.val || 0) : (entry.stars || 0);
  entry.savedAt = Date.now();
  const share = $("#jr-share") && $("#jr-share").checked;
  journals[key] = entry;
  persist();

  if (share && webhookUrl()) {
    const body = JOURNAL_QUESTIONS.map((q) => entry[q.id] ? "_" + q.label + "_\n" + entry[q.id] : "")
      .filter(Boolean).join("\n\n");
    const d = dateFromKey(key);
    const st = entry.stars ? "　" + "★".repeat(entry.stars) + "☆".repeat(5 - entry.stars) : "";
    const wOf = (id) => { const w = WEATHER.find((x) => x.id === id); return w ? w.label : "—"; };
    const wl = (entry.mind || entry.body)
      ? "心 " + wOf(entry.mind) + "　体 " + wOf(entry.body) + "\n\n" : "";
    sendSlack("*" + fmtDate(d) + "　" + profile.name + " のジャーナル*" +
      (isPast() ? "（後から記録）" : "") + st + "\n" +
      wl + body).then((ok) => {
      if (ok) { entry.posted = true; journals[key] = entry; persist(); }
      render();
      showToast(ok ? "保存してSlackに共有しました" : "保存しました（Slack共有に失敗）");
      runFeedback(key);
    });
  } else {
    entry.posted = false;
    journals[key] = entry;
    persist();
    render();
    showToast("保存しました");
    runFeedback(key);
  }
}

/* ---------- TAV actions ---------- */
function addTav() {
  const title = $("#tav-title").value.trim();
  if (!title) { showToast("気づきを入力してください"); return; }
  tavs.unshift({ id: uid(), title, memo: $("#tav-memo").value.trim(), decision: null, due: "", review: "", createdAt: todayKey() });
  persist();
  tavFilter = "active";
  render();
  showToast("気づきを追加しました");
}

function addTavBulk() {
  const ta = $("#tav-bulk");
  if (!ta) return;
  const lines = (ta.value || "").split("\n")
    .map((s) => s.replace(/^[\s・\-–—*•\d.、）)]+/, "").trim())
    .filter((s) => s.length > 0);
  if (!lines.length) { showToast("1行に1つずつ入力してください"); return; }
  const now = todayKey();
  lines.reverse().forEach((title) => {
    tavs.unshift({ id: uid(), title, memo: "", decision: null, due: "", review: "", createdAt: now });
  });
  persist();
  tavBulk = false; tavFilter = "active";
  render();
  showToast(lines.length + "件の気づきを追加しました");
}

function findTav(id) { return tavs.find((t) => t.id === id); }

function tavSetDue(id) {
  const t = findTav(id);
  if (!t) return;
  const def = t.due || (() => { const d = appNow(); d.setDate(d.getDate() + 7); return keyFromDate(d); })();
  openModal({
    title: "いつまでにやる？",
    body: '<label class="fld-label">期日</label><input class="fld" type="date" id="md-due" value="' + def + '">',
    okLabel: "決定する",
    onOk: () => {
      const v = $("#md-due").value;
      if (!v) { showToast("期日を選んでください"); return false; }
      t.decision = "yes"; t.due = v; t.completedAt = null; t.touchedAt = todayKey();
      persist(); render(); showToast("期日を設定しました");
    },
  });
}

function tavComplete(id) {
  const t = findTav(id);
  if (!t) return;
  openModal({
    title: "やってみて、どうだった？",
    body: '<textarea class="fld" id="md-review" placeholder="実行した結果と、そこから得たこと"></textarea>' +
      '<label class="fld-label">手ごたえ<span class="opt-tag">任意</span></label>' +
      '<div class="eff" id="md-eff" data-val="">' +
        '<button class="eff-opt" data-e="good">役に立った</button>' +
        '<button class="eff-opt" data-e="meh">いまひとつ</button>' +
      '</div>' +
      (webhookUrl()
        ? '<label class="chk" style="margin-bottom:14px"><input type="checkbox" id="md-share"><span>Slackに共有する</span></label>'
        : ''),
    okLabel: "完了にする",
    onOk: () => {
      const v = $("#md-review").value.trim();
      if (!v) { showToast("振り返りを書いてください"); return false; }
      const share = $("#md-share") && $("#md-share").checked;
      const eb = $("#md-eff");
      t.effect = eb ? (eb.dataset.val || "") : "";
      t.review = v; t.completedAt = todayKey(); t.decision = "yes"; t.touchedAt = todayKey();
      t.shared = !!share;
      persist(); render();
      if (share && webhookUrl()) {
        sendSlack("*" + fmtDate(appNow()) + "　" + profile.name + " がTAVを実行*\n" +
          "◉ " + t.title + "\n\n_やってみて_\n" + v).then((ok) =>
          showToast(ok ? "完了しました。Slackに共有しました" : "完了しました（Slack共有に失敗）"));
      } else showToast("完了しました");
    },
  });
}

function tavShare(id) {
  const t = findTav(id);
  if (!t || !webhookUrl()) return;
  sendSlack("*" + fmtDate(appNow()) + "　" + profile.name + " がTAVを実行*\n" +
    "◉ " + t.title + "\n\n_やってみて_\n" + t.review).then((ok) => {
    if (ok) { t.shared = true; persist(); render(); }
    showToast(ok ? "Slackに共有しました" : "共有に失敗しました");
  });
}

function tavSkip(id) {
  const t = findTav(id);
  if (!t) return;
  t.decision = "no"; t.due = ""; t.completedAt = null; t.touchedAt = todayKey();
  persist(); render(); showToast("「やらない」として記録しました");
}

function tavRevive(id) {
  const t = findTav(id);
  if (!t) return;
  t.decision = null;
  persist(); render();
}

function tavDelete(id) {
  openModal({
    title: "この気づきを削除しますか？",
    body: '<p class="card-sub">削除すると元に戻せません。「やらない」として残すこともできます。</p>',
    okLabel: "削除する",
    danger: true,
    onOk: () => { tavs = tavs.filter((t) => t.id !== id); persist(); render(); showToast("削除しました"); },
  });
}

/* ---------- modal ---------- */
function openModal({ title, body, okLabel, onOk, danger }) {
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = '<div class="modal-card"><h3 class="modal-title">' + title + '</h3>' + body +
    '<div class="modal-btns"><button class="btn-ghost" id="md-cancel">やめる</button>' +
    '<button class="' + (danger ? "btn-danger" : "btn-primary") + '" id="md-ok">' + okLabel + '</button></div></div>';
  document.body.appendChild(el);
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  el.querySelector("#md-cancel").onclick = () => el.remove();
  el.querySelector("#md-ok").onclick = () => { if (onOk() !== false) el.remove(); };
  const effBox = el.querySelector("#md-eff");
  if (effBox) {
    effBox.querySelectorAll(".eff-opt").forEach((b) => (b.onclick = (ev) => {
      ev.preventDefault();
      const v = b.dataset.e;
      effBox.dataset.val = effBox.dataset.val === v ? "" : v;
      effBox.querySelectorAll(".eff-opt").forEach((x) =>
        x.classList.toggle("on", x.dataset.e === effBox.dataset.val));
    }));
  }
  const first = el.querySelector("input, textarea");
  if (first) first.focus();
}

function dateByOffset(n) {
  const d = appNow(); d.setDate(d.getDate() - n);
  return d;
}
function targetKey() { return keyFromDate(dateByOffset(dayOffset)); }
function isPast() { return dayOffset > 0; }
// 開始日より前にはさかのぼれない
function maxBack() {
  if (!profile || !profile.startDate) return MAX_BACK;
  const diff = daysBetween(dateFromKey(profile.startDate), dateFromKey(todayKey()));
  return Math.max(0, Math.min(MAX_BACK, diff));
}

/* =========================================================
   月次レポート
========================================================= */
let monthlyLoading = false;
let monthlyReport = null;
let monthOffset = 1;        // デモ：記録の揃った先月を初期表示
const W2V = { sun: 3, cloud: 2, rain: 1 };

// 対象月の基準日（その月の1日）
function monthBase(off) {
  const n = appNow();
  return new Date(n.getFullYear(), n.getMonth() - off, 1);
}
// 開始月まで何ヶ月さかのぼれるか
function maxMonthBack() {
  if (!profile || !profile.startDate) return 0;
  const s = dateFromKey(profile.startDate), n = appNow();
  return Math.max(0, (n.getFullYear() - s.getFullYear()) * 12 + (n.getMonth() - s.getMonth()));
}

function collectMonth(off) {
  const now = appNow();
  const base = monthBase(off || 0);
  const y = base.getFullYear(), mo = base.getMonth(), dim = new Date(y, mo + 1, 0).getDate();
  const ym = y + "-" + String(mo + 1).padStart(2, "0");
  const isCurrent = (off || 0) === 0;
  const nH = profile.habits.length || 1;

  let rec = 0, full = 0, jr = 0, doneCnt = 0;
  const mind = [], body = [], wc = { sun: 0, cloud: 0, rain: 0 };
  const perHabit = {}; profile.habits.forEach((h) => (perHabit[h.id] = 0));
  const journalTexts = [];

  for (let i = 1; i <= dim; i++) {
    const k = ym + "-" + String(i).padStart(2, "0");
    if (isCurrent && dateFromKey(k) > now) break;
    const v = logs[k], j = journals[k];
    if (v && (v.done || []).length) {
      rec++; doneCnt += v.done.length;
      if (v.done.length >= nH) full++;
      v.done.forEach((id) => { if (perHabit[id] !== undefined) perHabit[id]++; });
    }
    if (j && j.savedAt) {
      jr++;
      const t = JOURNAL_QUESTIONS.map((q) => j[q.id]).filter(Boolean).join(" / ");
      if (t) journalTexts.push(i + "日" + (j.stars ? "（重要度" + j.stars + "）" : "") + "：" + t);
    }
    if (j && j.mind) { wc[j.mind]++; mind.push({ d: i, v: W2V[j.mind] }); }
    if (j && j.body) body.push({ d: i, v: W2V[j.body] });
  }

  const elapsed = isCurrent ? Math.min(dim, now.getDate()) : dim;
  const tavDone = tavs.filter((t) => t.completedAt && t.completedAt.slice(0, 7) === ym);
  const tavOpenN = tavs.filter((t) => ["plan","over","new"].includes(tavStatus(t))).length;
  const tavSkipN = tavs.filter((t) => t.decision === "no").length;

  return {
    month: mo + 1, year: y, dim, elapsed,
    kpi: { rate: Math.round(doneCnt / (nH * Math.max(1, elapsed)) * 100), rec, full, jr, tav: tavDone.length },
    habits: profile.habits.map((h) => ({ name: h.name, done: perHabit[h.id], total: elapsed })),
    mind, body, weather: wc,
    tav: { done: tavDone.length, open: tavOpenN, skip: tavSkipN },
    tavList: tavDone,
    journalTexts,
  };
}

// 記録量に応じて、どのセクションを出すかを決める
function monthSections(m) {
  const wTotal = m.weather.sun + m.weather.cloud + m.weather.rain;
  return {
    weather: wTotal >= 3,              // 天気が3日分以上
    themes: m.journalTexts.length >= 3, // ジャーナル3件以上
    balance: m.journalTexts.length >= 8,// ジャーナル8件以上
    tav: (m.tav.done + m.tav.open + m.tav.skip) > 0,
  };
}

function monthPrompt(m, sec) {
  const lines = [];
  lines.push("【対象】" + m.year + "年" + m.month + "月（" + m.elapsed + "日分）");
  if (m.habits.length) {
    lines.push("【習慣の達成状況】");
    m.habits.forEach((h) => lines.push("・" + h.name + "：" + h.done + "/" + h.total + "日"));
    lines.push("【記録した日】" + m.kpi.rec + "日（うち全習慣達成 " + m.kpi.full + "日）");
  }
  if (sec.weather) {
    lines.push("【心と体の天気】晴れ" + m.weather.sun + "日／曇り" + m.weather.cloud + "日／雨" + m.weather.rain + "日");
  }
  if (m.tavList.length) {
    lines.push("【実行した気づき(TAV)】");
    m.tavList.forEach((t) => lines.push("・" + t.title + " → " + (t.review || "")));
  }
  if (m.journalTexts.length) {
    lines.push("【ジャーナルの記述】");
    m.journalTexts.slice(-25).forEach((t) => lines.push(t));
  }
  // 生成してほしい項目を明示（データがないものは作らせない）
  const want = ["headline", "body", "question"];
  if (sec.themes) want.push("themes");
  if (sec.balance) want.push("balance");
  lines.push("");
  lines.push("【出力してほしい項目】" + want.join(", "));
  if (!sec.themes) lines.push("※themesは出力しないでください（記録が少ないため）");
  if (!sec.balance) lines.push("※balanceは出力しないでください（記録が少ないため）");
  return lines.join("\n");
}

async function runMonthly() {
  monthlyLoading = true; monthlyReport = null; render();
  try {
    const m = collectMonth(monthOffset);
    const sec = monthSections(m);
    const ai = await callAI("monthly", monthPrompt(m, sec));
    monthlyReport = Object.assign({}, m, {
      offset: monthOffset,
      sec,
      headline: ai.headline || "",
      body_text: ai.body || "",
      question: ai.question || "",
      // データが足りない項目は、AIが返してきても使わない
      themes: sec.themes && Array.isArray(ai.themes) ? ai.themes : [],
      balance: sec.balance && Array.isArray(ai.balance) ? ai.balance : [],
      at: Date.now(),
    });
  } catch (e) {
    console.error("monthly", e);
    monthlyReport = { error: String(e.message || e) };
  }
  monthlyLoading = false; render();
}

/* ---------- 月次レポートの描画 ---------- */
function msLineChart(mind, body, dim) {
  const W = 320, H = 96, P = 8;
  const x = (d) => P + ((d - 1) / Math.max(1, dim - 1)) * (W - P * 2);
  const y = (v) => H - P - ((v - 1) / 2) * (H - P * 2);
  const path = (arr) => arr.length < 2 ? "" :
    arr.map((p, i) => (i ? "L" : "M") + x(p.d).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ");
  const area = (arr) => arr.length < 2 ? "" :
    path(arr) + " L" + x(arr[arr.length - 1].d).toFixed(1) + "," + (H - P) + " L" + x(arr[0].d).toFixed(1) + "," + (H - P) + " Z";
  return '<svg class="ms-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    [1, 2, 3].map((v) => '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="rgba(25,28,34,.1)" stroke-width="1"/>').join("") +
    '<path d="' + area(mind) + '" fill="rgba(40,64,122,.10)"/>' +
    '<path d="' + path(mind) + '" fill="none" stroke="#28407A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="' + path(body) + '" fill="none" stroke="#B08A3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';
}

function msRadar(items) {
  if (!items || !items.length) return "";
  const S = 220, cc = S / 2, R = 78, n = items.length;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (i / n) * 2 * Math.PI;
    return [(cc + Math.cos(a) * r).toFixed(1), (cc + Math.sin(a) * r).toFixed(1)];
  };
  let rings = "", spokes = "", labels = "";
  [0.25, 0.5, 0.75, 1].forEach((fr) => {
    rings += '<polygon points="' + items.map((_, i) => pt(i, R * fr).join(",")).join(" ") +
      '" fill="none" stroke="rgba(25,28,34,.12)" stroke-width="1"/>';
  });
  items.forEach((it, i) => {
    const [px, py] = pt(i, R);
    spokes += '<line x1="' + cc + '" y1="' + cc + '" x2="' + px + '" y2="' + py + '" stroke="rgba(25,28,34,.1)" stroke-width="1"/>';
    const [lx, ly] = pt(i, R + 22);
    labels += '<text x="' + lx + '" y="' + ly + '" text-anchor="middle" dominant-baseline="middle" class="ms-raxis">' + esc(it.axis) + '</text>';
  });
  const poly = items.map((it, i) => pt(i, R * (Math.max(0, Math.min(5, it.v)) / 5)).join(",")).join(" ");
  return '<svg class="ms-radar" viewBox="0 0 ' + S + ' ' + S + '">' + rings + spokes +
    '<polygon points="' + poly + '" fill="rgba(40,64,122,.18)" stroke="#28407A" stroke-width="2"/>' +
    items.map((it, i) => { const [px, py] = pt(i, R * (Math.max(0, Math.min(5, it.v)) / 5)); return '<circle cx="' + px + '" cy="' + py + '" r="3.2" fill="#28407A"/>'; }).join("") +
    labels + '</svg>';
}

function msDonut(dn, op, sk) {
  const total = Math.max(1, dn + op + sk), R = 34, C = 2 * Math.PI * R;
  let acc = 0;
  const seg = (n, col) => {
    const len = (n / total) * C;
    const el = '<circle cx="45" cy="45" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="15" stroke-dasharray="' + len.toFixed(1) + ' ' + (C - len).toFixed(1) + '" stroke-dashoffset="' + (-acc).toFixed(1) + '" transform="rotate(-90 45 45)"/>';
    acc += len; return el;
  };
  return '<svg class="ms-donut" viewBox="0 0 90 90">' +
    seg(dn, "#28407A") + seg(op, "#B08A3E") + seg(sk, "rgba(25,28,34,.16)") +
    '<text x="45" y="46" text-anchor="middle" class="ms-dnum">' + dn + '</text>' +
    '<text x="45" y="58" text-anchor="middle" class="ms-dlab">実行</text></svg>';
}

/* ---------- weather grid (振り返り) ---------- */
function weatherGridHTML(kind, title) {
  const year = appNow().getFullYear();
  const today = appNow();
  const count = { sun: 0, cloud: 0, rain: 0 };
  const sM2 = profile.startDate && dateFromKey(profile.startDate).getFullYear() === year
    ? dateFromKey(profile.startDate).getMonth() : 0;
  const eM2 = today.getFullYear() === year ? today.getMonth() : 11;
  let grid = "";
  for (let m = sM2; m <= eM2; m++) {
    const dim = new Date(year, m + 1, 0).getDate();
    let cells = "";
    for (let i = 1; i <= dim; i++) {
      const k = year + "-" + String(m + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      const dd = dateFromKey(k);
      if (profile.startDate && dd < dateFromKey(profile.startDate)) continue;
      if (dd > today) continue;
      const v = journals[k] && journals[k][kind];
      if (v) count[v] = (count[v] || 0) + 1;
      const style = v ? "background:" + WEATHER_COLOR[v] + ";border:1px solid transparent"
        : "background:#EDEAE1;border:1px solid transparent";
      cells += '<span class="cell" style="' + style + '" title="' + k + '"></span>';
    }
    if (!cells) continue;
    grid += '<div class="month-row"><span class="month-label">' + (m + 1) + '月</span><div class="day-cells">' + cells + '</div></div>';
  }
  const total = count.sun + count.cloud + count.rain;
  if (total === 0) return "";
  return '<div class="wg"><div class="wg-title">' + title +
    '<span>晴れ ' + count.sun + '・曇り ' + count.cloud + '・雨 ' + count.rain + '</span></div>' +
    '<div class="year-grid">' + grid + '</div></div>';
}

/* ---------- journal review (振り返りタブ) ---------- */
function journalReviewHTML() {
  const keys = Object.keys(journals).filter((k) => journals[k] && journals[k].savedAt).sort();
  if (keys.length === 0) {
    return '<section class="card"><h2 class="card-title">ジャーナルの記録</h2>' +
      '<div class="empty-box"><div class="em-i">◇</div>' +
      '<p>まだジャーナルの記録がありません。<br>心と体の天気をひとつ選ぶだけでも、<br>翌月の振り返りが変わります。</p></div></section>';
  }
  const year = appNow().getFullYear();
  const today = appNow();

  // 年間グリッド（記録した日）
  const sM = profile.startDate && dateFromKey(profile.startDate).getFullYear() === year
    ? dateFromKey(profile.startDate).getMonth() : 0;
  const eM = today.getFullYear() === year ? today.getMonth() : 11;
  let grid = "";
  for (let m = sM; m <= eM; m++) {
    const dim = new Date(year, m + 1, 0).getDate();
    let cells = "";
    for (let i = 1; i <= dim; i++) {
      const k = year + "-" + String(m + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      const dd = dateFromKey(k);
      if (profile.startDate && dd < dateFromKey(profile.startDate)) continue;
      if (dd > today) continue;
      const has = journals[k] && journals[k].savedAt;
      const style = has ? "background:#B08A3E;border:1px solid transparent"
        : "background:#EDEAE1;border:1px solid transparent";
      cells += '<span class="cell" style="' + style + '" title="' + k + '"></span>';
    }
    if (!cells) continue;
    grid += '<div class="month-row"><span class="month-label">' + (m + 1) + '月</span><div class="day-cells">' + cells + '</div></div>';
  }

  // 月別グループ（新しい順・全文表示）
  const byMonth = {};
  keys.forEach((k) => {
    const ym = k.slice(0, 7);
    (byMonth[ym] = byMonth[ym] || []).push(k);
  });
  const months = Object.keys(byMonth).sort().reverse();
  const entries = months.map((ym) => {
    const p = ym.split("-");
    const rows = byMonth[ym].sort().reverse().map((k) => {
      const e = journals[k];
      const d = k.split("-");
      const body = JOURNAL_QUESTIONS.map((q) =>
        e[q.id] ? '<div class="jrv-q">' + q.label + '</div><div class="jrv-a">' + esc(e[q.id]) + '</div>' : ''
      ).join("");
      const stars = e.stars ? '<span class="jrv-stars">' + "★".repeat(e.stars) + '</span>' : '';
      const wIco = (id) => id ? '<span class="jrv-w w-' + id + '">' + weatherSVG(id) + '</span>' : '';
      const wSet = (e.mind || e.body) ? '<span class="jrv-ws">' + wIco(e.mind) + wIco(e.body) + '</span>' : '';
      return '<details class="jrv"><summary><span class="jrv-date">' + Number(d[1]) + '/' + Number(d[2]) + '</span>' + stars +
        '<span class="jrv-peek">' + esc((JOURNAL_QUESTIONS.map((q) => e[q.id]).filter(Boolean).join(" ／ ")).slice(0, 34)) + '…</span></summary>' +
        '<div class="jrv-body">' + body + '</div></details>';
    }).join("");
    return '<div class="jrv-month"><div class="jrv-month-label">' + p[0] + '年' + Number(p[1]) + '月' +
      '<span>' + byMonth[ym].length + '日</span></div>' + rows + '</div>';
  }).join("");

  return '<section class="card"><h2 class="card-title">ジャーナルの記録</h2>' +
    '<p class="card-sub">金の点がジャーナルを書いた日です。累計 ' + keys.length + '日ぶんの記録があります。</p>' +
    '<div class="year-grid">' + grid + '</div>' +
    weatherGridHTML("mind", "心の天気") +
    weatherGridHTML("body", "体の天気") +
    '<div class="jrv-list">' + entries + '</div></section>';
}

/* ---------- mini ring ---------- */
function miniRingHTML() {
  const now = appNow();
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const useH = hasHabits();
  let monthDays = 0;
  for (let i = 1; i <= dim; i++) {
    const k = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
    if (useH ? (logs[k] && (logs[k].done || []).length > 0)
             : (journals[k] && journals[k].savedAt)) monthDays++;
  }
  const progress = Math.min(1, monthDays / dim);
  const R = 34, C = 2 * Math.PI * R;
  const complete = allThreeDone();
  const col = complete ? "#B08A3E" : "#28407A";
  return '<div class="mini-ring' + (complete ? ' gold' : '') + '" id="mini-ring" data-progress="' + progress + '">' +
    '<svg viewBox="0 0 80 80">' +
    '<circle cx="40" cy="40" r="' + R + '" fill="none" stroke="rgba(40,64,122,.14)" stroke-width="5"/>' +
    '<circle id="mr-arc" cx="40" cy="40" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="6" stroke-linecap="round" transform="rotate(-90 40 40)" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/>' +
    '</svg><div class="mini-ring-txt">' + monthDays + '<small>/' + dim + '</small></div></div>';
}

function allThreeDone() {
  const k = todayKey();
  const posted = !!(logs[k] && logs[k].posted);
  const jr = !!(journals[k] && journals[k].savedAt);
  const tv = tavs.some((t) => t.completedAt === k || t.touchedAt === k);
  return posted && jr && tv;
}

function animateMiniRing() {
  const wrap = $("#mini-ring");
  if (!wrap || ringAnimated) return;
  ringAnimated = true;
  const progress = parseFloat(wrap.dataset.progress) || 0;
  const arc = $("#mr-arc");
  const C = 2 * Math.PI * 34;
  if (prefersReduced()) {
    arc.style.strokeDashoffset = C * (1 - progress); return;
  }
  const t0 = performance.now(), dur = 1100;
  (function frame(t) {
    const p = Math.min(((t || performance.now()) - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    arc.style.strokeDashoffset = C * (1 - progress * e);
    if (p < 1) requestAnimationFrame(frame);
  })(performance.now());
}

/* ---------- TAV view ---------- */
function tavStatus(t) {
  if (t.decision === "no") return "no";
  if (t.completedAt) return "done";
  if (!t.decision) return "new";
  if (t.due && dateFromKey(t.due) < dateFromKey(todayKey())) return "over";
  return "plan";
}
const TAV_LABEL = { new: "未判定", plan: "予定", over: "期限切れ", done: "完了", no: "やらない" };
const TAV_ORDER = { over: 0, plan: 1, new: 2, done: 3, no: 4 };

function tavDueInfo(t) {
  if (!t.due) return null;
  const n = daysBetween(dateFromKey(todayKey()), dateFromKey(t.due));
  const p = t.due.split("-");
  const date = Number(p[1]) + "/" + Number(p[2]);
  if (n < 0) return { n, date, text: Math.abs(n) + "日超過", cls: "over" };
  if (n === 0) return { n, date, text: "今日", cls: "today" };
  if (n === 1) return { n, date, text: "明日", cls: "today" };
  if (n <= 7) return { n, date, text: "あと" + n + "日", cls: "soon" };
  return { n, date, text: date, cls: "later" };
}

function tavView() {
  const list = tavs.map((t) => ({ t, s: tavStatus(t) }));
  const counts = {
    active: list.filter((x) => ["over","plan","new"].includes(x.s)).length,
    done:   list.filter((x) => x.s === "done").length,
    no:     list.filter((x) => x.s === "no").length,
  };
  const q = tavQuery.trim().toLowerCase();
  // 検索中はタブを横断して全件から探す
  let shown = q ? list.slice() : list.filter((x) =>
    tavFilter === "active" ? ["over","plan","new"].includes(x.s) :
    tavFilter === "done" ? x.s === "done" : x.s === "no"
  );
  if (q) shown = shown.filter(({ t }) =>
    (t.title || "").toLowerCase().includes(q) ||
    (t.memo || "").toLowerCase().includes(q) ||
    (t.review || "").toLowerCase().includes(q));

  // ---- カード1件 ----
  const card = ({ t, s }) => {
    const di = tavDueInfo(t);
    const expanded = !!tavOpen[t.id] || s === "over";
    let actions = "";
    if (s === "new") {
      actions = '<button class="btn-ghost sm" data-tav-do="' + t.id + '">やる（期日を決める）</button>' +
        '<button class="btn-ghost sm" data-tav-skip="' + t.id + '">やらない</button>';
    } else if (s === "plan" || s === "over") {
      actions = '<button class="btn-ghost sm" data-tav-done="' + t.id + '">実行した</button>' +
        '<button class="btn-ghost sm" data-tav-do="' + t.id + '">期日を変える</button>' +
        '<button class="btn-ghost sm" data-tav-skip="' + t.id + '">やらない</button>';
    } else if (s === "no") {
      actions = '<button class="btn-ghost sm" data-tav-revive="' + t.id + '">やっぱりやる</button>';
    } else if (s === "done" && !t.shared && webhookUrl()) {
      actions = '<button class="btn-ghost sm" data-tav-share="' + t.id + '">Slackに共有する</button>';
    }
    const effect = t.effect
      ? '<span class="tav-eff e-' + t.effect + '">' + (t.effect === "good" ? "役に立った" : "いまひとつ") + '</span>' : "";
    return '<div class="tav tav-' + s + (expanded ? " open" : "") + '">' +
      '<button class="tav-row" data-tav-toggle="' + t.id + '">' +
        '<span class="tav-title">' + esc(t.title) + '</span>' +
        (di ? '<span class="tav-due d-' + di.cls + '">' + di.text + '</span>' : '') +
        (s === "done" ? '<span class="tav-check">✓</span>' : '') +
      '</button>' +
      (expanded ?
        '<div class="tav-body">' +
          (t.memo ? '<div class="tav-memo">' + esc(t.memo) + '</div>' : '') +
          (t.review ? '<div class="tav-review"><span>やってみて' + effect + '</span>' + esc(t.review) + '</div>' : '') +
          (di && s !== "done" && s !== "no" ? '<div class="tav-date">期日 ' + di.date + '</div>' : '') +
          (actions ? '<div class="tav-actions">' + actions + '</div>' : '') +
          '<button class="tav-del" data-tav-del="' + t.id + '">削除</button>' +
        '</div>' : '') +
      '</div>';
  };

  // ---- 実行中タブは期日でグループ分け ----
  let items = "";
  if (shown.length === 0) {
    items = '<p class="empty">' + (q ? "該当する気づきが見つかりません。"
      : tavFilter === "active"
        ? "まだ気づきがありません。月例会やふだんの会話で「これは真似したい」と思ったことを書き留めておきましょう。"
        : "該当する気づきはまだありません。") + '</p>';
  } else if (tavFilter === "active" && !q) {
    const g = { over: [], today: [], week: [], later: [], none: [] };
    shown.forEach((x) => {
      if (x.s === "new") { g.none.push(x); return; }
      const di = tavDueInfo(x.t);
      if (!di) { g.none.push(x); return; }
      if (di.n < 0) g.over.push(x);
      else if (di.n <= 1) g.today.push(x);
      else if (di.n <= 7) g.week.push(x);
      else g.later.push(x);
    });
    const byDue = (a, b) => (a.t.due || "9999") < (b.t.due || "9999") ? -1 : 1;
    const sec = (key, label, cls) => {
      const arr = g[key].sort(byDue);
      if (!arr.length) return "";
      return '<div class="tav-group"><div class="tav-gh ' + cls + '">' + label +
        '<span>' + arr.length + '</span></div>' + arr.map(card).join("") + '</div>';
    };
    items = sec("over", "期限切れ", "g-over") + sec("today", "今日・明日", "g-today") +
            sec("week", "今週", "g-week") + sec("later", "これから", "g-later") +
            sec("none", "未判定", "g-none");
  } else {
    items = shown.sort((a, b) =>
      (b.t.completedAt || b.t.createdAt || "") < (a.t.completedAt || a.t.createdAt || "") ? -1 : 1
    ).map(card).join("");
  }

  const chip = (k, label, n) =>
    '<button class="chip' + (tavFilter === k ? " on" : "") + '" data-tavfilter="' + k + '">' + label + ' ' + n + '</button>';

  // ---- 追加フォーム ----
  const addForm = tavBulk
    ? '<p class="card-sub">1行に1つずつ書いてください。月例会のメモをそのまま貼り付けられます。</p>' +
      '<textarea class="fld bulk-ta" id="tav-bulk" placeholder="面談ではまず相手の原体験を聞く\n週次の数字を月曜の朝に確認する\n任せたら口を出さない"></textarea>' +
      '<button class="btn-primary" id="tav-bulk-add">まとめて追加する</button>' +
      '<button class="btn-ghost" id="tav-mode-one" style="margin-bottom:0">1件ずつ入力に戻す</button>'
    : '<p class="card-sub">Takeaway Value — 人の話や日々の中で得た「これは真似したい」を、実行まで運ぶための場所です。</p>' +
      '<input class="fld" id="tav-title" placeholder="例：面談ではまず相手の原体験を聞く">' +
      '<textarea class="fld" id="tav-memo" placeholder="補足メモ（任意）"></textarea>' +
      '<button class="btn-primary" id="tav-add">気づきを追加する</button>' +
      '<button class="btn-ghost" id="tav-mode-bulk" style="margin-bottom:0">まとめて追加する</button>';

  const total = tavs.length;
  return '<main class="body">' +
    '<section class="card"><h2 class="card-title">TAVを書き留める</h2>' + addForm + '</section>' +
    '<section class="card"><div class="chips">' +
      chip("active", "実行中・未判定", counts.active) + chip("done", "完了", counts.done) + chip("no", "やらない", counts.no) +
    '</div>' +
    (total >= 8 ? '<input class="fld tav-search" id="tav-q" type="search" placeholder="キーワードで絞り込む" value="' + esc(tavQuery) + '">' : '') +
    (q ? '<p class="tav-qnote">「' + esc(tavQuery) + '」の検索結果　' + shown.length + '件<button class="tav-qclear" id="tav-q-clear">クリア</button></p>' : '') +
    items + '</section></main>';
}

/* =========================================================
   振り返りトップ：年間の推移グラフ
========================================================= */
// 開始月〜今月までを月ごとに集計
function yearMonths() {
  const now = appNow(), y = now.getFullYear();
  const sM = (profile.startDate && dateFromKey(profile.startDate).getFullYear() === y)
    ? dateFromKey(profile.startDate).getMonth() : 0;
  const eM = now.getMonth();
  const nH = (profile.habits || []).length || 1;
  const out = [];
  for (let m = sM; m <= eM; m++) {
    const dim = new Date(y, m + 1, 0).getDate();
    let days = 0, rec = 0, done = 0, jrN = 0;
    const mind = [], body = [];
    for (let i = 1; i <= dim; i++) {
      const k = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      const dd = dateFromKey(k);
      if (profile.startDate && dd < dateFromKey(profile.startDate)) continue;
      if (dd > now) continue;
      days++;
      const v = logs[k], j = journals[k];
      if (v && (v.done || []).length) { rec++; done += v.done.length; }
      if (j && j.savedAt) jrN++;
      if (j && j.mind) mind.push(W2V[j.mind]);
      if (j && j.body) body.push(W2V[j.body]);
    }
    const avg = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
    out.push({ m: m + 1, days, rec, jr: jrN,
      rate: days ? Math.round(done / (nH * days) * 100) : 0,
      mind: avg(mind), body: avg(body) });
  }
  return out;
}

// 心と体の折れ線
// 先月の「同じ日数ぶん」を数える（今月がまだ途中のときの公平な比較用）
function prevMonthSameSpan(mIndex1, days) {
  const y = appNow().getFullYear();
  const pm = mIndex1 - 1;              // 1始まりの月番号
  if (pm < 1) return null;
  const dim = new Date(y, pm, 0).getDate();
  const n = Math.min(days, dim);
  const nH = (profile.habits || []).length || 1;
  let jr = 0, done = 0, counted = 0;
  for (let i = 1; i <= n; i++) {
    const k = y + "-" + String(pm).padStart(2, "0") + "-" + String(i).padStart(2, "0");
    if (profile.startDate && dateFromKey(k) < dateFromKey(profile.startDate)) continue;
    counted++;
    const v = logs[k], j = journals[k];
    if (v && (v.done || []).length) done += v.done.length;
    if (j && j.savedAt) jr++;
  }
  if (!counted) return null;
  return { jr, rate: Math.round(done / (nH * counted) * 100), days: counted };
}

function mbLineHTML(ms) {
  const pts = ms.filter((x) => x.mind !== null || x.body !== null);
  if (pts.length < 2) return "";
  const W = 330, H = 124, P = 18, PB = 22;
  const n = ms.length;
  const x = (i) => P + (n === 1 ? (W - P * 2) / 2 : (i / (n - 1)) * (W - P * 2));
  const y = (v) => (H - PB) - ((v - 1) / 2) * ((H - PB) - P);
  const seg = (key) => {
    // 値のある月だけを線でつなぐ
    const arr = ms.map((d, i) => ({ i, v: d[key] })).filter((o) => o.v !== null);
    if (!arr.length) return { d: "", dots: "" };
    const dd = arr.map((o, k) => (k ? "L" : "M") + x(o.i).toFixed(1) + "," + y(o.v).toFixed(1)).join(" ");
    return { d: dd, arr: arr };
  };
  const sm = seg("mind"), sb = seg("body");
  let g = "";
  [[3, "晴"], [2, "曇"], [1, "雨"]].forEach(([v, lab]) => {
    g += '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) +
         '" stroke="rgba(25,28,34,.09)" stroke-width="1"/>' +
         '<text x="' + (P - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end" class="cv-ax">' + lab + '</text>';
  });
  const dots = (s, col) => (s.arr || []).map((o) =>
    '<circle cx="' + x(o.i).toFixed(1) + '" cy="' + y(o.v).toFixed(1) + '" r="3" fill="' + col + '"/>').join("");
  const labs = ms.map((d, i) =>
    '<text x="' + x(i).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" class="cv-ax">' + d.m + '月</text>').join("");
  const area = sm.d ? sm.d + " L" + x((sm.arr[sm.arr.length-1]).i).toFixed(1) + "," + (H - PB) +
                      " L" + x(sm.arr[0].i).toFixed(1) + "," + (H - PB) + " Z" : "";
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="cv">' + g +
    (area ? '<path d="' + area + '" fill="rgba(40,64,122,.08)"/>' : '') +
    (sm.d ? '<path d="' + sm.d + '" fill="none" stroke="#28407A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' : '') +
    (sb.d ? '<path d="' + sb.d + '" fill="none" stroke="#B08A3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' : '') +
    dots(sm, "#28407A") + dots(sb, "#B08A3E") + labs + '</svg>';
}

// 月別の棒グラフ
function barsHTML(ms, key, color, suffix) {
  const W = 330, H = 104, P = 16, PB = 22;
  const mx = Math.max(1, ...ms.map((d) => d[key]));
  const slot = (W - P * 2) / ms.length;
  const bw = Math.min(34, slot * 0.5);
  let out = "";
  ms.forEach((d, i) => {
    const v = d[key];
    const bh = (v / mx) * (H - PB - P - 8);
    const bx = P + (i + 0.5) * slot - bw / 2;
    const by = H - PB - bh;
    const last = i === ms.length - 1;
    out += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) +
           '" height="' + Math.max(1, bh).toFixed(1) + '" rx="2" fill="' + color + '" opacity="' + (last ? 1 : .5) + '"/>' +
           '<text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (by - 5).toFixed(1) + '" text-anchor="middle" class="cv-v">' + v + (suffix || "") + '</text>' +
           '<text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" class="cv-ax">' + d.m + '月</text>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="cv">' + out + '</svg>';
}

function trendHTML() {
  const ms = yearMonths();
  if (ms.length < 2) return "";          // 2ヶ月目から表示
  const line = mbLineHTML(ms);
  const anyJr = ms.some((d) => d.jr > 0);
  const anyRec = ms.some((d) => d.rec > 0);
  const useH = hasHabits() && anyRec;
  if (!line && !anyJr && !useH) return "";

  // 先月との比較（今月が途中なら「同じ日数ぶん」で比べる）
  const last = ms[ms.length - 1];
  const now = appNow();
  const dimNow = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const partial = last.days < dimNow;          // 今月はまだ途中か
  const diff = (key, unit) => {
    if (ms.length < 2) return "";
    let a, note = "先月より";
    if (partial) {
      const p = prevMonthSameSpan(last.m, last.days);
      if (!p) return "";
      a = p[key];
      note = "先月の同じ時期より";
    } else {
      a = ms[ms.length - 2][key];
    }
    if (a === null || a === undefined) return "";
    const d = Math.round((last[key] - a) * 10) / 10;
    if (d === 0) return note.replace("より", "と") + "同じペース";
    return note + Math.abs(d) + unit + (d > 0 ? "多い" : "少ない");
  };

  return '<section class="card trend"><h2 class="card-title">今年の移り変わり</h2>' +
    (line
      ? '<h3 class="tr-h">心と体の天気</h3>' +
        '<p class="tr-s">ジャーナルに記録した天気の、月ごとの平均です。</p>' + line +
        '<div class="tr-lg"><span><i style="background:#28407A"></i>心</span>' +
        '<span><i style="background:#B08A3E"></i>体</span>' +
        '<span class="tr-r">上＝晴れ／下＝雨</span></div>'
      : '') +
    (anyJr
      ? '<h3 class="tr-h">ジャーナルを書いた数</h3>' +
        '<p class="tr-s">' + (diff("jr", "件") || "月ごとの件数です。濃い棒が今月。") + '</p>' +
        barsHTML(ms, "jr", "#B08A3E", "")
      : '') +
    (useH
      ? '<h3 class="tr-h">習慣の達成率</h3>' +
        '<p class="tr-s">' + (diff("rate", "ポイント") || "月ごとの平均です。濃い棒が今月。") + '</p>' +
        barsHTML(ms, "rate", "#28407A", "%")
      : '') +
    '</section>';
}

function recordView(stats) {
  const year = appNow().getFullYear();
  const nHabits = profile.habits.length || 1;
  const today = appNow();
  const startM = profile.startDate && dateFromKey(profile.startDate).getFullYear() === year
    ? dateFromKey(profile.startDate).getMonth() : 0;
  const endM = today.getFullYear() === year ? today.getMonth() : 11;
  let grid = "";
  for (let m = startM; m <= endM; m++) {
    const dim = new Date(year, m + 1, 0).getDate();
    let cells = "";
    for (let i = 1; i <= dim; i++) {
      const k = year + "-" + String(m + 1).padStart(2, "0") + "-" + String(i).padStart(2, "0");
      const dd = dateFromKey(k);
      if (profile.startDate && dd < dateFromKey(profile.startDate)) continue;
      if (dd > today) continue;
      const v = logs[k];
      const ratio = v ? (v.done || []).length / nHabits : 0;
      let style;
      if (ratio >= 1) style = "background:#28407A;border:1px solid transparent";
      else if (ratio > 0) style = "background:transparent;border:1.5px solid rgba(40,64,122," + (0.4 + ratio * 0.5).toFixed(2) + ")";
      else style = "background:#EDEAE1;border:1px solid transparent";
      cells += '<span class="cell" style="' + style + '" title="' + k + '"></span>';
    }
    if (!cells) continue;
    grid += '<div class="month-row"><span class="month-label">' + (m + 1) + '月</span><div class="day-cells">' + cells + '</div></div>';
  }

  const last28 = [];
  for (let i = 27; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    last28.push(keyFromDate(d));
  }
  let habitRows = "";
  profile.habits.forEach((h) => {
    const hs = computeHabitStats(h.id);
    const best = habitBestStreak(h.id);
    const dots = last28.map((k) =>
      '<span class="hd' + ((logs[k] && (logs[k].done || []).includes(h.id)) ? " on" : "") + '" title="' + k + '"></span>'
    ).join("");
    habitRows += '<div class="habit-row"><div class="habit-head">' +
      '<span class="habit-name">' + esc(h.name) + '</span>' +
      '<span class="habit-meta"><em>連続 ' + hs.streak + '日</em>' +
      (best > hs.streak ? '　最長 <b>' + best + '日</b>' : '') +
      '　達成率 ' + hs.rate + '%</span></div>' +
      '<div class="habit-dots">' + dots + '</div></div>';
  });

  return '<main class="body">' +
    trendHTML() +
    (hasHabits() ? '<section class="card"><h2 class="card-title">' + year + '年の記録</h2>' +
    '<p class="card-sub">一つの点が一日。すべて達成した日は塗りつぶし、一部達成の日は輪郭のみで表示されます。始めてからの日々だけを並べています。</p>' +
    '<div class="year-grid">' + grid + '</div>' +
    '<div class="glegend"><span><i class="gd gd-full"></i> すべて達成</span><span><i class="gd gd-part"></i> 一部達成</span><span><i class="gd gd-none"></i> 未記録</span></div>' +
    '</section>' : '') +
    (hasHabits() ? '<section class="card"><h2 class="card-title">習慣ごとの歩み</h2>' +
    '<p class="card-sub">直近28日の記録です。どの習慣が続いているかを個別に確認できます。</p>' +
    habitRows + '</section>' : '') +
    monthlyHTML() +
    tavReviewHTML() +
    journalReviewHTML() +
    '<section class="card"><h2 class="card-title">今月の記録カード</h2>' +
    '<p class="card-sub">この月のドットと成績を1枚の画像（1080×1080）にまとめます。Slackやインスタでの共有用に。</p>' +
    '<button class="btn-primary" id="dl-card">' + (appNow().getMonth() + 1) + '月の記録カードを保存する</button>' +
    '<p class="note">スマホで保存されない場合は、開いた画像を長押しして「写真に保存」してください。</p>' +
    '</section></main>';
}

/* =========================================================
   クラウド同期
========================================================= */
let sb = null;              // Supabaseクライアント
let session = null;         // ログインセッション
let syncState = "off";      // off | ready | syncing | saved | error
let syncError = "";         // 直近の同期エラー内容
let pushTimer = null;
let localOnly = localStorage.getItem("demo_local_only") === "1";
let loginStep = "email";    // email | code
let loginEmail = "";
let cloudReady = false;     // initCloud 完了フラグ

function cloudEnabled() { return !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase); }
function signedIn() { return !!(sb && session); }

async function initCloud() {
  if (!cloudEnabled()) return;
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    });
    const { data } = await sb.auth.getSession();
    session = data ? data.session : null;
    sb.auth.onAuthStateChange((_e, s) => {
      const was = !!session;
      session = s;
      if (!was && s) { loginStep = "email"; render(); pullAndMerge(); }
      if (was && !s) { syncState = "off"; render(); }
    });
    if (session) { syncState = "ready"; await pullAndMerge(); }
    cloudReady = true;

    // オンライン復帰・アプリ再表示で自動的に再同期
    window.addEventListener("online", retrySync);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) retrySync();
    });
  } catch (e) { console.error("initCloud", e); cloudReady = true; }
}

let lastSyncAt = 0;
async function retrySync() {
  if (!signedIn()) return;
  if (navigator.onLine === false) return;
  // エラー時は即、通常時も30秒に1回まで
  const now = Date.now();
  if (syncState !== "error" && now - lastSyncAt < 30000) return;
  lastSyncAt = now;
  await pullAndMerge();
  renderSyncBadge();
}

async function sendMagicLink(email) {
  if (!sb) return { ok: false, msg: "同期が設定されていません" };
  const { error } = await sb.auth.signInWithOtp({
    email: email.trim(),
    options: { emailRedirectTo: location.href.split("#")[0] },
  });
  if (error) {
    const m = (error.message || "").toLowerCase();
    if (m.includes("not allowed") || m.includes("signups")) return { ok: false, msg: "このメールアドレスは登録されていません" };
    if (m.includes("rate") || m.includes("too many") || m.includes("security purposes"))
      return { ok: false, msg: "短時間に何度も送信されました。1〜2分おいてから、もう一度お試しください。" };
    if (m.includes("invalid") && m.includes("email")) return { ok: false, msg: "メールアドレスの形式をご確認ください" };
    return { ok: false, msg: "送信できませんでした。しばらく待ってお試しください。" };
  }
  return { ok: true };
}

async function verifyCode(code) {
  if (!sb) return { ok: false, msg: "同期が設定されていません" };
  const { error } = await sb.auth.verifyOtp({
    email: loginEmail, token: code.trim(), type: "email",
  });
  if (error) {
    const m = (error.message || "").toLowerCase();
    if (m.includes("expired")) return { ok: false, msg: "コードの有効期限が切れています。送り直してください" };
    if (m.includes("invalid")) return { ok: false, msg: "コードが違います。もう一度ご確認ください" };
    return { ok: false, msg: "確認できませんでした" };
  }
  return { ok: true };
}

async function signOutCloud() {
  if (!sb) return;
  await sb.auth.signOut();
  session = null; syncState = "off";
  showToast("ログアウトしました");
  render();
}

/* --- マージ：日付キーは和集合、内容は新しい方（updated基準はクラウド優先） --- */
function mergeAll(cloud) {
  if (!cloud) return false;
  let changed = false;
  // profile：クラウド側に中身があれば採用（ローカルが空のときのみ上書きしない）
  if (cloud.profile && cloud.profile.name) {
    if (!profile || !profile.name) { profile = normalizeProfile(cloud.profile); changed = true; }
    else {
      const merged = normalizeProfile(cloud.profile);
      // 習慣・目標はクラウドを正とする（最後に保存した端末の設定）
      profile = Object.assign({}, profile, merged);
      changed = true;
    }
  }
  const mergeMap = (local, remote) => {
    const out = Object.assign({}, remote || {});
    Object.keys(local || {}).forEach((k) => {
      if (!out[k]) { out[k] = local[k]; return; }
      const a = local[k], b = out[k];
      const doneA = (a.done || []).length, doneB = (b.done || []).length;
      const savedA = a.savedAt || 0, savedB = b.savedAt || 0;
      if (savedA || savedB) { if (savedA > savedB) out[k] = a; }
      else if (doneA > doneB) out[k] = a;
    });
    return out;
  };
  const nl = mergeMap(logs, cloud.logs);
  const nj = mergeMap(journals, cloud.journals);
  if (JSON.stringify(nl) !== JSON.stringify(logs)) { logs = nl; changed = true; }
  if (JSON.stringify(nj) !== JSON.stringify(journals)) { journals = nj; changed = true; }

  const byId = {};
  (cloud.tavs || []).forEach((t) => (byId[t.id] = t));
  (tavs || []).forEach((t) => { if (!byId[t.id]) byId[t.id] = t; });
  const nt = Object.values(byId);
  if (JSON.stringify(nt) !== JSON.stringify(tavs)) { tavs = nt; changed = true; }
  return changed;
}

let fetchedGroup = null;    // 名簿から取得したグループ（profile未作成でも保持）

async function fetchGroup() {
  if (!signedIn()) return;
  try {
    const email = (session.user.email || "").toLowerCase();
    const { data, error } = await sb.from("member_groups")
      .select("grp").eq("email", email).maybeSingle();
    if (error) { console.error("group", error); return; }
    fetchedGroup = data && data.grp ? data.grp : "";
    applyFetchedGroup();
  } catch (e) { console.error("fetchGroup", e); }
}

// オンボーディング完了後など、profileができた時点でも反映できるように
function applyFetchedGroup() {
  if (fetchedGroup === null || !profile) return false;
  if (profile.group !== fetchedGroup) {
    profile.group = fetchedGroup;
    persistLocal();
    return true;
  }
  return false;
}

async function pullAndMerge() {
  if (!signedIn()) return;
  syncState = "syncing"; render();
  try {
    const { data, error } = await sb.from("circle_data").select("*").eq("user_id", session.user.id).maybeSingle();
    if (error) throw error;
    if (data) mergeAll(data);
    persistLocal();
    await fetchGroup();
    await pushNow();            // マージ結果を書き戻す
    if (syncState !== "error") { syncState = "saved"; syncError = ""; }
  } catch (e) {
    console.error("pull", e);
    syncState = "error";
    syncError = (e && (e.message || e.error_description || e.details)) || String(e);
  }
  render();
}

async function pushNow() {
  if (!signedIn()) return;
  try {
    const { error } = await sb.from("circle_data").upsert({
      user_id: session.user.id,
      profile: profile || {}, logs, journals, tavs,
      updated_at: new Date().toISOString(),
    }, { onConflict: "user_id" });
    if (error) throw error;
    syncState = "saved"; syncError = "";
  } catch (e) {
    console.error("push", e);
    syncState = "error";
    syncError = (e && (e.message || e.error_description || e.details)) || String(e);
  }
}

function schedulePush() {
  if (!signedIn()) return;
  syncState = "syncing";
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => { await pushNow(); renderSyncBadge(); }, 1200);
}

function renderSyncBadge() {
  const el = document.getElementById("sync-badge");
  if (el) el.className = "sync-badge s-" + syncState;
  const t = document.getElementById("sync-text");
  if (t) t.textContent = syncLabel();
}
function syncLabel() {
  return { off: "この端末のみ", ready: "同期中", syncing: "保存中…", saved: "同期済み", error: "同期エラー" }[syncState] || "";
}
